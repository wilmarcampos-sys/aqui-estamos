<script>
/* Tema día/noche temprano (mismo criterio que el app) */
window.temaEfectivo = function(){
  try{ var p = localStorage.getItem('ae_tema');
    if(p==='claro') return 'light'; if(p==='oscuro') return 'dark';
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }catch(e){ return 'dark'; }
};
document.documentElement.setAttribute('data-eff', window.temaEfectivo());
</script>
