<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="logo/marca.svg">
<title>Aquí Estamos · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css?v=1.90.0">
<style>
  /* El panel es mobile-first: una columna, pestañas fijas abajo. En pantalla
     grande se centra en una franja de ancho de celular para no deformarse. */
  html,body{overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:460px;margin:0 auto;
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  /* hidden siempre gana; el panel es flex solo cuando está visible */
  [hidden]{display:none!important}
  #panel:not([hidden]){display:flex;flex-direction:column;height:100%}

  /* ---- cabecera de la vista ---- */
  .top{flex:0 0 auto;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .top .row{align-items:flex-end}
  .top h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .top .sub{font-size:12.5px;color:var(--dim);margin-top:2px}

  .panel-main{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px calc(18px + var(--safe))}
  .view.on{display:block}

  /* ---- barra de pestañas fija abajo ---- */





  /* ---- una parada de la ruta ----
     En el teléfono se apila; en pantalla ancha se reparte en columnas para
     que no quede medio metro de vacío entre el nombre y el botón. Cada
     parada se ve dónde empieza y dónde termina. */
  .jrow{display:grid;gap:4px 14px;align-items:start;padding:14px 12px;
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"tick nom wa" ". dir dir" ". tel tel";
    border:1px solid var(--line);border-radius:13px;background:var(--bg2);
    margin-bottom:9px}
  .jrow:hover{border-color:var(--line2)}
  .jrow.hecha{opacity:.5;background:none}
  .jrow > .tick2{grid-area:tick;margin-top:2px}
  .jrow .jq{grid-area:nom;min-width:0}
  .jrow .jd{grid-area:dir;min-width:0}
  .jrow .jt{grid-area:tel;min-width:0}
  .jrow .waq{grid-area:wa}
  .jrow .waq.vacio2{background:none;pointer-events:none}
  .jnom{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;
    letter-spacing:-.2px;line-height:1.3}
  .jnom .jn{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--chip);
    color:var(--dim);font-size:12px;font-weight:850;display:grid;place-items:center}
  .jmot{font-size:12.5px;color:var(--pri);font-weight:700;margin-top:4px}
  .jlbl{display:block;font-size:10px;font-weight:850;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--dim);margin-bottom:1px}
  .jbar{font-size:12px;color:var(--dim);margin-top:2px}
  .dline .dtx.sin{color:var(--dim);font-weight:600;font-style:italic}
  @media (min-width:860px){
    .jrow{grid-template-columns:auto minmax(200px,1.1fr) minmax(210px,1fr) minmax(160px,.7fr) auto;
      grid-template-areas:"tick nom dir tel wa";align-items:center;gap:16px;padding:14px 16px}
    .jrow .jq{align-self:center}
  }
  /* ---- dirección y teléfono de cada parada, con su copiar ---- */
  /* El botón se queda al lado aunque la dirección ocupe dos renglones:
     con wrap se caía debajo y la fila perdía la lectura. */
  .dline{display:flex;align-items:flex-start;gap:8px;margin-top:2px;flex-wrap:nowrap}
  .dline .dtx{font-size:13.5px;font-weight:700;color:var(--txt);letter-spacing:.2px;
    text-decoration:none;overflow-wrap:anywhere;flex:0 1 auto;min-width:0;
    line-height:1.35;padding-top:5px}
  .dline .dtx.tel{color:var(--acc);letter-spacing:.4px}
  .dcopy{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:0 11px;min-height:34px;font-family:inherit;font-size:11.5px;
    font-weight:800;cursor:pointer;display:inline-flex;align-items:center}
  .dcopy:active{opacity:.7}
  .dcopy.ok{background:rgba(63,154,104,.18);border-color:#3F9A68;color:#7ED4A2}

  /* En pantalla ancha las etiquetas sobran: la columna ya dice qué es, y
     repetirlas diez veces por equipo solo gasta renglones. */
  .dcopy svg{width:15px;height:15px}
  .dcopy{padding:0 9px;min-height:30px}
  .dcopy.ok::after{content:"Copiado";font-size:11px;margin-left:6px}
  .dcopy.ok svg{display:none}
  @media (min-width:860px){
    .jrow .jlbl{display:none}
    .jrow{padding:11px 16px;gap:14px}
    .jnom{font-size:14.5px}
    .jmot{display:inline-block;margin:4px 0 0;padding:2px 8px;border-radius:999px;
      background:color-mix(in srgb, var(--pri) 16%, transparent);font-size:11.5px}
  }
  /* ---- clave con ojo para revisarla ---- */
  .claveln{position:relative;margin-top:10px}
  .claveln input{width:100%;padding-right:46px}
  .verclave{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;display:grid;place-items:center;background:none;border:0;
    color:var(--dim);cursor:pointer;border-radius:9px}
  .verclave svg{width:19px;height:19px}
  .verclave.on{color:var(--acc)}
  /* ---- portada del reporte dentro del panel ---- */
  .dhero{position:relative;display:block;overflow:hidden;border-radius:16px;
    margin-bottom:14px;text-decoration:none;color:#fff;min-height:186px;
    background:#0D1520;transition:transform .18s var(--ease,ease)}
  .dhero:active{transform:scale(.99)}
  .dh-foto{position:absolute;inset:0;background:url('img/wck-1.jpg') center 45%/cover}
  .dh-velo{position:absolute;inset:0;
    background:linear-gradient(95deg,rgba(13,21,32,.9) 0%,rgba(13,21,32,.82) 34%,
      rgba(13,21,32,.5) 62%,rgba(13,21,32,.14) 100%)}
  .dh-cont{position:relative;display:block;padding:18px 20px}
  .dh-vivo{display:inline-flex;align-items:center;gap:7px;background:#D62828;
    font-size:10.5px;font-weight:850;letter-spacing:1.5px;padding:6px 11px;border-radius:6px}
  .dh-vivo i{width:6px;height:6px;border-radius:50%;background:#fff}
  .dhero b{display:block;font-size:24px;font-weight:850;letter-spacing:-.9px;margin-top:12px}
  .dh-sub{display:block;font-size:13px;line-height:1.55;color:#B9C5D6;margin-top:7px;
    max-width:470px}
  .dh-sub em{font-style:normal;color:#F87171;font-weight:750}
  .dh-bt{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#fff;
    color:#0D1520;font-size:13.5px;font-weight:800;padding:10px 16px;border-radius:10px}
  .dh-bt svg{width:15px;height:15px}
  @media (min-width:760px){ .dhero{min-height:200px} .dh-cont{padding:22px 26px}
    .dhero b{font-size:28px} }
  /* ---- tablero de inicio ---- */
  .dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:520px){ .dgrid{grid-template-columns:1fr 1fr} }
  .dnum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px}
  .dnum b{display:block;font-size:26px;font-weight:850;line-height:1;letter-spacing:-1px;
    color:var(--c,var(--txt))}
  .dnum span{display:block;font-size:11.5px;color:var(--dim);margin-top:6px;font-weight:650}
  .dnota{margin:8px 2px 0;font-size:12.5px;color:var(--dim)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  @media (max-width:640px){ .tiles{grid-template-columns:1fr 1fr} }
  .tile{display:block;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;font-family:inherit;color:var(--txt);cursor:pointer;
    text-decoration:none;transition:border-color .18s,transform .18s}
  .tile:hover{border-color:var(--acc)}
  .tile:active{transform:scale(.985)}
  .tile .ti{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .tile .ti .ic{width:21px;height:21px;color:var(--acc)}
  .tile.pub .ti .ic{color:var(--dim)}
  .tile .ti .c{font-style:normal;font-size:12px;font-weight:850;padding:2px 8px;
    border-radius:999px;background:var(--chip);color:var(--dim)}
  .tile b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
  .tile span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
  .tabbar{flex:0 0 auto;display:flex;background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:var(--safe)}
  .tabbar button{flex:1;background:none;border:0;color:var(--dim);font-family:inherit;cursor:pointer;
    padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .tabbar button .ic{width:22px;height:22px}
  .tabbar button .lab{font-size:11px;font-weight:600}
  .tabbar button.on{color:var(--acc)}
  .tabbar button .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;
    padding:0 4px;border-radius:8px;background:#d97706;color:#160c02;font-size:10px;font-weight:800;
    display:none;align-items:center;justify-content:center;line-height:1}
  .tabbar button .badge.on{display:flex}

  /* ============================================================
     ESCRITORIO (>=1000px)
     El panel deja de fingir que es un celular: las pestañas se van a
     una columna lateral y el contenido usa el ancho real de la pantalla.
     ============================================================ */
  @media (min-width:1000px){
    #app{max-width:none;flex-direction:row;border:0}
    #panel:not([hidden]){flex-direction:row;width:100%}

    /* la barra de pestañas pasa a ser barra lateral */
    /* app.css redondea las barras de navegación; de lado eso deja una
       pastilla flotante en vez de una columna. */
    .tabbar{order:-1;flex-direction:column;width:216px;flex:0 0 216px;
      border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:3px;
      background:var(--surf);border-radius:0;margin:0;height:100%;align-self:stretch}
    .tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;
      padding:11px 13px;border-radius:12px;text-align:left}
    .tabbar button .lab{font-size:14px;font-weight:650}
    .tabbar button.on{background:var(--chip)}
    .tabbar button .badge{position:static;margin-left:auto;left:auto;top:auto}

    /* columna de contenido */
    .top{padding:20px 30px 16px}
    .top h2{font-size:27px}
    .view{padding:20px 30px 30px}
    .view > *{max-width:1180px}

    /* las filas se acomodan en varias columnas en vez de una tira larga */
    .prow-grid{display:grid;gap:10px;max-width:1180px;
      grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}
    .prow-grid > *{margin:0;border-radius:14px;border:1px solid var(--line)}

    /* la hoja inferior se vuelve panel lateral derecho */
    .sheet{left:auto;right:0;top:0;bottom:0;width:min(460px,42vw);
      border-radius:0;border-left:1px solid var(--line);max-height:none}
  }
  @media (min-width:1500px){
    .prow-grid{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));max-width:1500px}
    .view > *{max-width:1500px}
  }

  /* .btn nace con width:100%; dentro de una fila flex eso expulsa a sus
     vecinos. Se neutraliza aqui en vez de parchear cada fila. */
  /* Cuántos reciben hoy: el número manda, el desglose se abre solo si se pide.
     (La versión anterior se pintaba en horizontal porque .card es flex.) */
  .totalbox{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px 18px;
    border-radius:16px;background:var(--chip);border:1px solid var(--line)}
  .totalbox > b{font-size:44px;line-height:1;font-weight:850;color:var(--acc);
    font-variant-numeric:tabular-nums}
  .totalbox > span{font-size:16px;font-weight:750;color:var(--txt);line-height:1.25}
  .totalbox small{display:block;font-size:12.5px;font-weight:550;color:var(--dim);margin-top:3px}

  /* fuentes: mismo lenguaje que las capas del mapa */
  .capasel{display:flex;flex-direction:column;gap:2px;border-radius:14px;
    background:var(--surf);border:1px solid var(--line);padding:4px 13px}
  .capasel label{display:flex;align-items:flex-start;gap:11px;padding:12px 0;cursor:pointer;min-height:44px}
  .capasel label + label{border-top:1px solid var(--line)}
  .capasel.solo{padding:0 13px}
  .capasel input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--acc)}
  .capasel span{flex:1;font-size:14px;font-weight:650;color:var(--txt);line-height:1.35}
  .capasel span i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .capasel span b{font-variant-numeric:tabular-nums;color:var(--acc)}
  .capasel span small{display:block;font-size:12.3px;font-weight:550;color:var(--dim);margin-top:3px}

  /* las tres calidades de ubicación son el dato y el control a la vez */
  .ubisel{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .ubisel .us{text-align:left;font-family:inherit;padding:13px 14px;border-radius:14px;
    background:var(--surf);border:1.6px solid var(--line);cursor:pointer;color:var(--txt)}
  .ubisel .us b{display:block;font-size:26px;font-weight:850;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--dim)}
  .ubisel .us span{display:block;font-size:13.5px;font-weight:700;margin-top:5px}
  .ubisel .us small{display:block;font-size:12px;color:var(--dim);margin-top:4px;line-height:1.35}
  .ubisel .us.on{border-color:var(--acc);background:rgba(79,156,249,.10)}
  .ubisel .us.on b{color:var(--acc)}
  .ubisel .us.fija{cursor:default}
  .ubisel .us.no{opacity:.55;cursor:default}

  /* Ubicar: en el celular una columna; en escritorio los datos a la izquierda
     y el mapa alto a la derecha, que es lo que de verdad hay que mirar. */
  .ubgrid{display:grid;gap:16px;margin-top:14px}
  .ubcol{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;order:2}
  .ubmapcol{min-height:300px;order:1}
  #ubmapa{height:44vh;min-height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  @media (min-width:1000px){
    .ubgrid{grid-template-columns:minmax(380px,460px) 1fr;align-items:start;
      max-width:1500px;height:calc(100vh - 190px)}
    .ubcol{overflow-y:auto;max-height:100%;order:1}
    .ubmapcol{height:100%;order:2}
    #ubmapa{height:100%;min-height:420px}
  }

  /* teléfono de la ficha: leerlo, copiarlo o llamar sin transcribirlo */
  /* casilla de entregado en la hoja de ruta */
  .tick2{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1.8px solid var(--line2);
    background:var(--surf);color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;
    display:grid;place-items:center;margin-right:10px}
  .tick2.on{background:#2f9e5f;border-color:#2f9e5f}
  .sbadge.bok{background:rgba(47,158,95,.16);color:#5FBE8A}

  /* hojas de ruta en papel: los equipos que salen sin datos las necesitan */
  @media print{
    #tabbar, .top, #j-imprimir, #j-cerrar, #j-volver, .waq, .btnrow{display:none!important}
    #app,#panel,.panel-main,main,.view{position:static!important;overflow:visible!important;height:auto!important;display:block!important}
    .view{padding:0!important}
    body{background:#fff!important;color:#000!important}
    .card,.prow,.alert{background:#fff!important;color:#000!important;border:1px solid #ccc!important;
      break-inside:avoid;page-break-inside:avoid}
    .card{page-break-after:always}
    .muted,.mt{color:#444!important}
    .tick2{border:1.5px solid #000!important;background:#fff!important}
    .tick2::after{content:"entregado";position:absolute;margin-left:42px;font-size:9px;color:#666}
    .prow{position:relative}
  }

  /* moverse por la cola sin tener que aplazar la ficha */
  /* ---- REPORTE ---- */
  .repbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .repbar .busca{flex:1 1 240px;min-width:180px;position:relative}
  .repbar .busca input{width:100%;height:40px;border-radius:11px;padding:0 14px 0 38px;
    background:var(--inp);border:1.4px solid var(--line2);color:var(--txt);font:inherit;font-size:14px}
  .repbar .busca input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,156,249,.16)}
  .repbar .busca svg{position:absolute;left:12px;top:11px;width:17px;height:17px;color:var(--dim)}
  .repbar .btn{height:40px;width:auto;padding:0 14px;font-size:13.5px;white-space:nowrap}
  .repbar .btn .cta{background:#04122B;color:var(--acc);border-radius:999px;padding:1px 7px;
    font-size:11.5px;font-weight:850;margin-left:6px}
  .repbar .btn.pri{background:var(--acc);color:#04122B;border-color:var(--acc)}

  .tira{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
  .tira::-webkit-scrollbar{display:none}
  .cifra{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:13px;
    padding:9px 14px;cursor:pointer;font:inherit;color:var(--txt);display:flex;align-items:baseline;
    gap:8px;white-space:nowrap;min-height:44px}
  .cifra b{font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
  .cifra span{font-size:12.5px;color:var(--dim);font-weight:600}
  .cifra.on{border-color:var(--acc);background:rgba(79,156,249,.12)}
  .cifra.rojo b{color:#F87171} .cifra.vio b{color:#A78BFA} .cifra.ambar b{color:#FBBF24}

  .activos{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 2px 12px;font-size:13px}
  .activos .res{font-weight:750} .activos .res b{font-size:16px}
  .activos .lim{color:var(--dim);margin-right:4px}
  .fa{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line2);
    border-radius:999px;padding:4px 5px 4px 11px;font-size:12.5px;font-weight:650}
  .fa.rojo{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#F87171}
  .fa.vio{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4);color:#A78BFA}
  .fa button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px;line-height:1;
    padding:2px 5px;opacity:.7}
  .fa button:hover{opacity:1}
  .quitar{background:none;border:0;color:var(--acc);font:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;text-decoration:underline;padding:6px 4px}

  .tablabox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .tablabox .scroll{overflow-x:auto}
  table.reptab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px}
  .reptab th{position:sticky;top:0;background:var(--surf);text-align:left;font-size:11px;
    letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:800;padding:11px 14px;
    white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line);z-index:5}
  .reptab th.act{color:var(--acc)}
  .reptab th .ord{opacity:.4;margin-left:4px;font-size:10px}
  .reptab th.act .ord{opacity:1}
  .reptab td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  .reptab tbody tr{cursor:pointer}
  .reptab tbody tr:hover td{background:rgba(255,255,255,.025)}
  .reptab .nom{font-weight:700;letter-spacing:-.15px}
  .reptab .sub{font-size:11.8px;color:var(--dim);margin-top:2px}
  .reptab .fic{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--acc)}
  .reptab .num{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
  .reptab .mas{color:var(--dim);font-size:11px;font-weight:700;margin-left:2px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;
    margin:1px 3px 1px 0;white-space:nowrap}
  .t-urg{background:rgba(248,113,113,.16);color:#F87171}
  .t-pri{background:rgba(251,191,36,.16);color:#FBBF24}
  .t-pro{background:rgba(147,163,189,.16);color:var(--dim)}
  .t-cond{background:rgba(167,139,250,.16);color:#A78BFA}
  .t-nec{background:rgba(79,156,249,.12);color:#9CC6FB}
  .t-ok{background:rgba(95,190,138,.16);color:#5FBE8A}
  .t-par{background:rgba(167,139,250,.13);color:#A78BFA}
  .t-sin{background:rgba(248,113,113,.13);color:#F87171}
  .pie{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surf);
    border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);flex-wrap:wrap}

  /* ventana de filtros */
  .scrim{position:fixed;inset:0;background:rgba(4,9,20,.72);z-index:120;backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px}
  .scrim .modal{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line2);border-radius:20px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.6)}
  .modal .mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mhead h2{margin:0;font-size:17px;font-weight:820}
  .modal .mhead .x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:22px;
    cursor:pointer;line-height:1;padding:4px 10px}
  .modal .mbody{padding:6px 20px 18px;overflow-y:auto}
  .modal .grupo{padding:15px 0;border-bottom:1px solid var(--line)}
  .modal .grupo:last-child{border-bottom:0}
  .modal .grupo h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;
    color:var(--dim);font-weight:800}
  .modal .chips{display:flex;gap:7px;flex-wrap:wrap}
  .modal .chip{border:1.4px solid var(--line2);background:transparent;color:var(--dim);font:inherit;
    font-size:13px;font-weight:650;padding:8px 13px;border-radius:999px;cursor:pointer;min-height:38px}
  .modal .chip.on{background:var(--acc);border-color:var(--acc);color:#04122B}
  .modal .chip.on.rojo{background:#F87171;border-color:#F87171;color:#2B0606}
  .modal .chip.on.vio{background:#A78BFA;border-color:#A78BFA;color:#20103F}
  .modal .chip .n{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
  .modal .mfoot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);
    background:var(--surf)}
  .modal .mfoot .btn{height:44px;width:auto;padding:0 16px}
  .modal .mfoot .btn.pri{flex:1;background:var(--acc);color:#04122B;border-color:var(--acc)}

  /* aviso de datos nuevos cuando no se puede repintar sin romper el trabajo */
  .avisonuevo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:950;
    display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;
    background:var(--card);border:1px solid var(--acc);box-shadow:0 10px 30px rgba(0,0,0,.45);
    font-size:13.5px;font-weight:650;color:var(--txt);max-width:92vw}
  .avisonuevo button{background:none;border:0;font-family:inherit;font-size:13.5px;font-weight:800;
    color:var(--acc);cursor:pointer;text-decoration:underline;padding:6px}
  .avisonuevo #an-cerrar{color:var(--dim);text-decoration:none;font-size:15px}

  .lnk{background:none;border:0;color:var(--link);font-family:inherit;font-size:inherit;
    font-weight:750;cursor:pointer;text-decoration:underline;padding:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin-bottom:12px}
  select.campo{appearance:none;-webkit-appearance:none;height:46px}

  /* equipos plegables con su ruta dibujada */
  .eqtog{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;
    font-family:inherit;color:var(--txt);cursor:pointer;text-align:left;min-height:44px}
  .eqtog .car{color:var(--dim);font-size:13px;padding-top:3px}
  .eqtog small{display:block;font-size:12.5px;color:var(--dim);font-weight:550;margin-top:3px}
  .rutamapa{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
  .pinnum{width:26px;height:26px;border-radius:50%;background:#4F9CF9;color:#04122b;
    display:grid;place-items:center;font-size:12px;font-weight:850;border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .pinnum.ok{background:#2f9e5f;color:#fff}

  /* la ciudad es la primera pista para ubicar: va como distintivo, no en un párrafo */
  .lugar{display:block;width:100%;text-align:left;margin-top:6px;padding:10px 12px;border-radius:12px;
    background:var(--surf);border:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--txt)}
  .lugar b{display:block;font-size:13.5px;font-weight:700}
  .lugar small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .lugar:hover{border-color:var(--acc)}

  .btn.soft2{background:rgba(124,58,237,.16);color:#c4b5fd;font-size:14px;height:auto;padding:12px 14px;
    line-height:1.35;box-shadow:none}
  .btn.soft2 small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
  :root[data-eff="light"] .btn.soft2{background:rgba(124,58,237,.12);color:#5B21B6}

  .ciudadchip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
    background:rgba(124,58,237,.16);color:#a78bfa;font-size:12.5px;font-weight:750;white-space:nowrap}
  .ciudadchip svg{width:13px;height:13px}
  :root[data-eff="light"] .ciudadchip{background:rgba(124,58,237,.13);color:#6D28D9}

  .navcola{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .navcola span{font-size:12.5px;font-weight:700;color:var(--dim)}
  .navcola .nc{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--chip);color:var(--txt);font-size:20px;font-weight:800;cursor:pointer;
    font-family:inherit;line-height:1}
  .navcola .nc:disabled{opacity:.35;cursor:default}
  .navcola .nc:hover:not(:disabled){background:var(--line)}

  /* la etiqueta de ubicación es también el atajo a la cola */
  .irubicar{background:rgba(124,58,237,.16);color:#a78bfa;border:1px solid rgba(124,58,237,.35);
    font-family:inherit;cursor:pointer;margin-top:4px;padding:5px 10px;min-height:30px}
  .irubicar:hover{background:rgba(124,58,237,.28)}

  .telrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
    padding:10px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
  .telrow .tl{flex:1;min-width:130px;font-size:17px;font-weight:800;letter-spacing:.4px;
    color:var(--txt);text-decoration:none;font-variant-numeric:tabular-nums}
  .telrow .cp{flex:0 0 auto;width:auto;height:40px;min-height:40px;padding:0 16px;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  .telrow .cp.ok{background:rgba(47,158,95,.18);color:#5FBE8A}

  .porque{margin-top:10px}
  .porque summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--link);
    padding:8px 3px;list-style:none;min-height:44px;display:flex;align-items:center}
  .porque summary::-webkit-details-marker{display:none}
  .porque summary::before{content:"▸ ";margin-right:5px}
  .porque[open] summary::before{content:"▾ "}
  .desglose{display:block;padding:2px 14px;border-radius:14px;
    background:var(--surf);border:1px solid var(--line)}
  .desglose .cl{display:flex;align-items:baseline;gap:12px;padding:11px 0;font-size:13.5px}
  .desglose .cl + .cl{border-top:1px solid var(--line)}
  .desglose .cl b{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;
    font-weight:800;font-size:16px;color:var(--dim)}
  .desglose .cl span{flex:1;color:var(--dim);line-height:1.4}
  .desglose .cl.ok b{color:var(--acc)}
  .desglose .cl.ok span{color:var(--txt);font-weight:700}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  /* objetivos táctiles: 44px es el mínimo cómodo con el pulgar */
  #v-ubicar .seg button{min-height:44px}
  #v-ubicar .leaflet-touch .leaflet-control-zoom a,
  #v-ubicar .leaflet-control-zoom a{width:44px;height:44px;line-height:44px;font-size:20px}
  #ub-descartar{min-height:44px;padding:0 12px}
  .btnrow > .btn{width:auto}

  /* badges pill (mismo lenguaje de la app) */
  .sbadge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.2px;vertical-align:1px}
  .sbadge.b3{background:rgba(239,68,68,.14);color:#F87171}
  .sbadge.b2{background:rgba(245,158,11,.16);color:#FBBF24}
  .sbadge.b1{background:rgba(201,162,39,.16);color:#D4AC2B}
  .fila{display:flex;align-items:center;gap:8px;font-size:16px}
  .seg{border-radius:999px}
  .seg button{border-radius:999px}

  /* ---- login ---- */
  .login{max-width:400px;margin:8vh auto;text-align:center;padding:0 20px}
  .login .mark{width:56px;height:56px;margin-bottom:14px}

  /* ---- alerta accionable (Inicio) ---- */
  /* La alerta informa; el botón estirado a todo el ancho gritaba más que
     el problema. Va en línea y con el tamaño de una acción secundaria. */
  .alert{border-radius:14px;padding:14px 16px 14px 18px;margin-bottom:9px;
    border:1px solid var(--line);background:var(--card);
    box-shadow:inset 3px 0 0 var(--otro)}
  .alert.red{box-shadow:inset 3px 0 0 var(--urg)}
  .alert.amber{box-shadow:inset 3px 0 0 var(--pri)}
  .alert.green{box-shadow:inset 3px 0 0 var(--c0);display:flex;align-items:center;gap:11px}
  .alert .ti{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
  .alert .cx{font-size:13.2px;color:var(--dim);margin-top:3px;line-height:1.45}
  .alert .btn{margin-top:11px;width:auto;min-width:0;padding:0 16px;min-height:40px;
    font-size:13.5px;display:inline-flex;align-items:center;border-radius:10px}
  .alert.green .ic{color:var(--c0);flex:0 0 auto;width:22px;height:22px}

  /* ---- fila grande "pendiente de mí" ---- */
  .bigrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;
    font-family:inherit;color:var(--txt)}
  .bigrow .grow b{font-size:15px;display:block}
  .bigrow .grow span{font-size:12.5px;color:var(--dim)}
  .bigrow .n{font-size:26px;font-weight:800;flex:0 0 auto}

  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
    font-weight:700;margin:18px 0 8px}
  .lbl:first-child{margin-top:4px}

  /* ---- segmented control (Personas) ---- */
  .seg{display:flex;background:#111b2e;border:1px solid var(--line);border-radius:12px;
    padding:3px;margin-bottom:12px;gap:3px}
  .seg button{flex:1;background:none;border:0;color:var(--dim);font-family:inherit;cursor:pointer;
    padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700}
  .seg button.on{background:#26344f;color:var(--txt)}
  .seg button .c{opacity:.75;font-weight:800}

  /* ---- buscador ---- */
  .buscabox{position:relative;margin-bottom:12px}
  .buscabox input{margin:0;padding-right:40px}
  .buscabox .limpiar{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:6px 10px;
    font-family:inherit;line-height:1}

  /* ---- fila compacta de persona ---- */
  /* Con 200 fichas, una tarjeta por fila es mucho borde y poca
     información. Filas separadas por filete: rinden el doble. */
  .prow{display:flex;align-items:center;gap:12px;background:none;border:0;
    border-bottom:1px solid var(--line);border-radius:0;padding:13px 2px;margin-bottom:0}
  .prow:last-child{border-bottom:0}
  .prow.pendiente{box-shadow:inset 3px 0 0 var(--pri);padding-left:12px}
  .prow.anulada{opacity:.6}
  .prow .info{flex:1;min-width:0;cursor:pointer}
  .prow .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
  .prow .nm .tick{color:#22c55e;flex:0 0 auto}
  .prow .mt{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .cd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#7aa7ff;letter-spacing:.5px;margin-top:1px}
  .waq{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:#25d366;border:0;cursor:pointer;
    display:grid;place-items:center;color:#04220f;text-decoration:none}
  .waq svg{width:20px;height:20px}
  .kebab{flex:0 0 auto;width:34px;height:40px;border-radius:11px;background:none;border:0;cursor:pointer;
    color:var(--dim);font-size:20px;font-family:inherit}
  .chev{flex:0 0 auto;width:34px;height:40px;border-radius:11px;background:none;border:0;cursor:pointer;
    color:var(--dim);font-size:15px;font-family:inherit;transition:transform .15s}
  .pgroup{margin-bottom:8px}
  .pgroup .prow{margin-bottom:0}
  .pgroup.abierto .chev{transform:rotate(180deg)}
  .pgroup.abierto .prow{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .subzones{background:var(--card);border:1px solid var(--line);border-top:0;
    border-radius:0 0 14px 14px;padding:2px 10px 10px;margin-top:-1px}
  .subrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#141f33;
    border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:7px;cursor:pointer;
    font-family:inherit;color:var(--txt)}
  .subrow .sm{font-size:13.5px;font-weight:600;display:block}
  .subrow .mt{font-size:12px;color:var(--dim);display:block}
  .subrow .cd{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#7aa7ff;letter-spacing:.5px;flex:0 0 auto}

  /* ---- ficha (bottom sheet) ---- */
  .fichacab{display:flex;align-items:center;gap:12px;margin:2px 0 4px}
  .fichacab .nm{font-size:18px;font-weight:800}
  .fichacab .rl{font-size:12.5px;color:var(--dim)}
  .codewrap{margin:12px 0}
  .codewrap .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:700}
  .codebg{display:flex;align-items:center;gap:10px;margin-top:7px;background:#111b2e;
    border:1.5px dashed #3f5478;border-radius:14px;padding:12px 14px}
  .codebg .cod{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;
    letter-spacing:2px;color:#8ec1ff;flex:1}
  .copiar{background:#233149;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 13px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;flex:0 0 auto}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #223050;font-size:14px}
  .kv:last-of-type{border-bottom:0}
  .kv .k{color:var(--dim)}
  .kv .v{font-weight:600;text-align:right}
  .kv .v.tel{color:#7aa7ff}
  .destroy{width:100%;background:none;border:0;color:#f87171;font-family:inherit;font-size:14px;
    font-weight:700;cursor:pointer;padding:14px;margin-top:6px}

  /* ---- Zonas ---- */
  .mapprev{background:#1a2436;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    margin-bottom:14px;cursor:pointer;position:relative}
  .mapprev #zmap{width:100%;height:172px;background:#1a2436}
  .mapprev .leaflet-container{background:#1a2436;font-family:inherit}
  .mapprev .abrir{position:absolute;right:10px;bottom:9px;z-index:800;background:rgba(15,23,42,.92);
    border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;color:#bcd4f5}
  .zrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-bottom:8px}
  .zrow.warn{border-color:#7c4a10;background:#1d1a10}
  .zrow .grow b{font-size:15px;display:block}
  .zrow .grow span{font-size:12.5px;color:var(--dim)}
  .zrow .pin{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
  .zrow .mini{margin:0}

  /* ---- Más ---- */
  .cuenta{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px;margin-bottom:8px}
  .cuenta .grow b{font-size:16px;display:block}
  .cuenta .grow span{font-size:12.5px;color:var(--dim)}
  .mitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;
    font-family:inherit;color:var(--txt)}
  .mitem .ic{width:20px;height:20px;color:#7aa7ff;flex:0 0 auto}
  .mitem.danger .ic{color:#f87171}
  .mitem .grow b{font-size:14.5px;display:block;font-weight:600}
  .mitem .grow span{font-size:12px;color:var(--dim)}
  .mitem .chev{color:var(--dim);font-size:18px}

  .avatar.big{width:52px;height:52px;font-size:20px}
  .estado.ejemplo{color:#fcd34d}
.selred{flex:1;min-width:0;height:34px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);color:var(--txt);font:650 12.5px/1 inherit;padding:0 10px;outline:none}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login" class="login" hidden>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <defs><clipPath id="p"><path d="M12 1.6c-4.6 0-8.3 3.7-8.3 8.3 0 5.9 8.3 12.5 8.3 12.5s8.3-6.6 8.3-12.5c0-4.6-3.7-8.3-8.3-8.3z"/></clipPath></defs>
      <g clip-path="url(#p)"><rect width="12" height="24" fill="#F2B705"/><rect x="12" width="12" height="24" fill="#D62828"/></g>
      <path d="M5.9 9.1h6.4a1.35 1.35 0 0 1 0 2.7H5.9z" fill="#fff"/>
      <path d="M18.1 12.2h-6.4a1.35 1.35 0 0 0 0 2.7h6.4z" fill="#fff"/>
    </svg>
    <h2 style="margin:0 0 6px">Administración</h2>
    <p class="muted" style="margin:0 0 18px">Entre con su correo y su clave.</p>
    <input id="mail" type="email" inputmode="email" placeholder="su-correo@ejemplo.com" autocomplete="username">
    <div class="claveln">
      <input id="clave" type="password" placeholder="Su clave o PIN" autocomplete="current-password">
      <button type="button" class="verclave" id="verclave" aria-label="Ver la clave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn" id="entrar" style="margin-top:12px">Entrar</button>
    <p class="muted" id="msg" style="margin-top:14px"></p>
    <button type="button" class="lnk" id="ver-enlace" style="margin-top:10px">Prefiero que me llegue un enlace al correo</button>
    <div id="porenlace" hidden style="margin-top:10px">
      <button class="btn flat" id="enviar" style="width:100%">Enviarme el enlace</button>
      <p class="muted" style="margin-top:8px;font-size:12.5px">Ojo: Hotmail, Outlook y Yahoo suelen descartar ese correo.</p>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel" hidden>
    <div class="panel-main">
    <div class="top">
      <div class="row">
        <div class="grow">
          <h2 id="titulo">Hoy</h2>
          <div class="sub" id="subtitulo"></div>
        </div>
      </div>
    </div>
    <main>
      <section class="view on" id="v-inicio"></section>
      <section class="view" id="v-pedidos"></section>
      <section class="view" id="v-personas"></section>
      <section class="view" id="v-zonas"></section>
      <section class="view" id="v-reporte"></section>
      <section class="view" id="v-ubicar"></section>
      <section class="view" id="v-despachos"></section>
      <section class="view" id="v-mas"></section>
    </main>
    </div>

    <nav class="tabbar" id="tabbar">
      <button data-v="inicio" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="lab">Inicio</span><span class="badge" id="bg-inicio"></span>
      </button>
      <button data-v="pedidos">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
/* ============================================================
   PANEL DE ADMINISTRACIÓN — Aquí Estamos
   Rediseño mobile-first: 4 pestañas fijas abajo (Inicio · Personas ·
   Zonas · Más), ficha en hoja inferior, y un modo demo (?ejemplo=1)
   para revisar la interfaz sin base de datos ni login.
   ============================================================ */
/* URL sin ".html": el panel se abre como /admin y no /admin.html.
   Solo en el sitio publicado — en localhost la extensión hace falta. */
(function limpiarURL(){
  const h = location.hostname;
  if(h==='localhost' || h==='127.0.0.1' || h==='') return;
  let p = location.pathname;
  if(p.endsWith('/index.html')) p = p.slice(0,-10) || '/';
  else if(p.endsWith('.html'))  p = p.slice(0,-5);
  if(p !== location.pathname) history.replaceState(null,'',p+location.search+location.hash);
})();

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[<>&"]/g, m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
let _t; function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('on');
  clearTimeout(_t); _t=setTimeout(()=>e.classList.remove('on'), 3200); }

const H = 3600e3;
const now = () => Date.now();
const DEMO = /[?&]ejemplo=1/.test(location.search);

/* ---- teléfono / WhatsApp ---- */
function telSoloDigitos(v){ let d=String(v||'').replace(/\D/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  while(d.length>12 && d.startsWith('57')) d=d.slice(2); return d; }
function telDigitos(v){ const d=telSoloDigitos(v);
  if(d.length===10 && d[0]==='3') return '57'+d;
  if(d.length===12 && d.startsWith('57') && d[2]==='3') return d;
  if(d.length>=11 && d.length<=15) return d; return null; }
function telBonito(v){ const d=telDigitos(v); if(!d) return String(v||'');
  if(d.startsWith('57') && d.length===12) return `+57 ${d.slice(2,5)} ${d.slice(5,8)} ${d.slice(8)}`;
  return '+'+d; }
const waLink = (v,msg)=>{ const d=telDigitos(v); if(!d) return '#';
  return 'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''); };

const soloDigitos = s => String(s??'').replace(/\D/g,'');
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,"");
const normRef = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const hace = ts => { if(!ts) return 'nunca'; const h=(now()-ts)/H;
  return h<1 ? 'hace '+Math.max(1,Math.round(h*60))+' min'
     : h<48 ? 'hace '+Math.round(h)+' h' : 'hace '+Math.round(h/24)+' días'; };

const UCOL = {3:'#dc2626', 2:'#d97706', 1:'#c9a227'};
const NOMBRE_ZONA = new Map((typeof ZONAS!=='undefined'?ZONAS:[]).map(z=>[z.id,z.n]));
const zonaNombre = id => NOMBRE_ZONA.get(id) || id || '—';
const zonaObj    = id => (typeof ZONAS!=='undefined'?ZONAS:[]).find(z=>z.id===id) || null;
function color(i){ return i>=80?'#8b1a1a' : i>=60?'#dc2626' : i>=40?'#d97706' : i>=20?'#c9a227' : '#3f8f5f'; }
function etiqueta(i){ return i>=80?'Sin ayuda' : i>=60?'Crítica' : i>=40?'Rezagada' : i>=20?'Parcial' : 'Atendida'; }

/* ============================================================
   ESTADO  (filas crudas de Supabase, o de demo)
   ============================================================ */
let COORDS   = [];   // objetos coordinador (micro-zona), incluye anulados
let REPORTES = [];
let ENTREGAS = [];
let CONTACTOS = {};  // folio -> {nombre, tel, whatsapp}  (tabla privada; requiere clave)
let CENSO    = [];   // viviendas del censo (privado con clave; anónimo sin ella)

/* Acceso a lo privado: por el MISMO correo con que entras al panel.

   la base te deja leer contactos y censo. Sin claves que pegar. */
let PRIV = false;
let ROL  = 'admin';   // 'admin' ve todo; 'censo' solo el censo y sus herramientas
const AKEY = ()=> PRIV ? '1' : '';   // compatibilidad con los avisos
let VISTA = 'inicio';
let SEG   = 'esperando';
let BUSCA = '';
let YO    = { email: '' };

const deCoo = c=>({ id:c.id, z:c.zona, micro:c.micro||'', radio:c.radio||500,
  lat:+c.lat, lng:+c.lng, nom:c.nombre, rol:c.rol||'', tel:c.tel, tel_e164:c.tel_e164||c.tel,
  email:c.email||'', nota:c.nota||'', foto:c.foto||null, ver:!!c.verificado, anulado:!!c.anulado,
  codigo:c.codigo||'', cuenta:c.cuenta||null, creado:+new Date(c.creado||Date.now()) });
const deRep = r=>({ id:r.id, z:r.zona, k:r.necesidad, u:r.urgencia, lat:+r.lat, lng:+r.lng,
  ref:r.referencia||'', personas:r.personas||0, ts:+new Date(r.creado||Date.now()),
  folio:r.folio||'', prioridad:r.prioridad||[], nota:r.nota||'' });
const norma = x => String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const deCen = c=>({ id:c.id, ficha:c.ficha||'', barrio:c.barrio||'', dir:c.direccion||'', sena:c.sena||'',
  nombre:[c.nombre,c.apellido].filter(Boolean).join(' '), cedula:c.cedula||'', tel:c.tel_e164||'',
  personas:c.personas||0, men5:c.menores5||0, may65:c.mayores65||0, cond:c.condiciones||[],
  ev:c.estado_vivienda||'', needs:c.necesidades||[], detalle:c.detalle||'', lat:c.lat?+c.lat:null, lng:c.lng?+c.lng:null,
  urg:c.urgencia||0, aprox:!!c.ubicacion_aprox, red:c.fuente_detalle||'', ciudad:c.ciudad||'', fuente:c.fuente||'app',
  archivada:!!c.archivada, motivo:c.motivo_descarte||'',
  ubicadoPor:c.ubicado_por||'', descPor:c.descartada_por||'',
  saltadaEl:c.saltada_el?+new Date(c.saltada_el):0,
  pedidaEl:c.pedida_el?+new Date(c.pedida_el):0,
  ts:+new Date(c.creado||Date.now()) });
const deEnt = e=>({ id:e.id, z:e.zona, k:e.necesidad, quien:e.quien||'Anónimo',
  cant:e.cantidad||'', lat:e.lat?+e.lat:null, lng:e.lng?+e.lng:null,
  ts:+new Date(e.creado||Date.now()) });

const activos = () => COORDS.filter(c=>!c.anulado);

/* ============================================================
   CÁLCULO (portado de calc.js) — focos, cobertura, desatención
   ============================================================ */
const CELL = 0.0016;
const celda = (lat,lng)=> Math.round(lat/CELL)+'_'+Math.round(lng/CELL);
const escalar = (u,n)=> Math.min(3, u + (n>=5?2:n>=3?1:0));
function dist(a1,o1,a2,o2){ const dy=(a2-a1)*110574, dx=(o2-o1)*111320*Math.cos((a1+a2)/2*Math.PI/180);
  return Math.sqrt(dx*dx+dy*dy); }

function focos(zid){
  const g = {};
  REPORTES.filter(r=>r.z===zid && r.lat).forEach(r=>{
    const c = r.ref ? 'r:'+normRef(r.ref) : 'c:'+celda(r.lat,r.lng);
    (g[c] = g[c] || {c, reps:[]}).reps.push(r);
  });
  return Object.values(g).map(f=>{
    f.n   = f.reps.length;
    f.lat = f.reps.reduce((s,r)=>s+r.lat,0)/f.n;
    f.lng = f.reps.reduce((s,r)=>s+r.lng,0)/f.n;
    f.ref = (f.reps.find(r=>r.ref)||{}).ref || '';
    f.ts  = Math.max(...f.reps.map(r=>r.ts));
    const byK = {};
    f.reps.forEach(r=>{ const e=byK[r.k]=byK[r.k]||{k:r.k,n:0,uBase:0,personas:0};
      e.n++; e.uBase=Math.max(e.uBase,r.u||1); e.personas+=r.personas||0; });
    f.needs = Object.values(byK).map(e=>({...e,u:escalar(e.uBase,e.n)})).sort((a,b)=>b.u-a.u||b.n-a.n);
    f.u = Math.max(...f.needs.map(x=>x.u));
    f.personas = f.needs.reduce((s,x)=>s+x.personas,0);
    return f;
  }).sort((a,b)=>b.u-a.u||b.n-a.n);
}
function repAtendido(r){
  return ENTREGAS.some(e=>e.k===r.k && e.z===r.z && e.ts>r.ts);
}
function cenAtendida(c){
  if(c.lat==null) return false;
  return ENTREGAS.some(e=>e.ts > now()-7*24*H && e.z && c.needs.length && true) &&
    false; /* sin lat de entregas aquí; el estado fino vive en la app */
}
function cubridores(lat,lng){
  return activos().filter(c=>c.lat && dist(lat,lng,c.lat,c.lng) <= (c.radio||500));
}
function huerfanos(){
  const out=[]; (ZONAS||[]).forEach(z=>focos(z.id).forEach(f=>{
    if(!cubridores(f.lat,f.lng).length) out.push({...f, zona:z}); }));
  return out.sort((a,b)=>b.u-a.u||b.n-a.n);
}
function solitarios(){
  const out=[]; (ZONAS||[]).forEach(z=>focos(z.id).forEach(f=>{
    const cb=cubridores(f.lat,f.lng); if(cb.length===1) out.push({...f, zona:z, solo:cb[0]}); }));
  return out.sort((a,b)=>b.u-a.u||b.n-a.n);
}
function estadoZona(z){
  const reps = REPORTES.filter(r=>r.z===z.id);
  const ents = ENTREGAS.filter(e=>e.z===z.id);
  const fs = focos(z.id);
  const personas = reps.reduce((s,r)=>s+(r.personas||0),0);
  const pendCrit = fs.filter(f=>f.u===3).length;
  const ultEnt = ents.length ? Math.max(...ents.map(e=>e.ts)) : 0;
  const horasSin = ultEnt ? (now()-ultEnt)/H : (reps.length?999:0);
  let idx = 0;
  if(reps.length){
    const gravedad = Math.min(1,(pendCrit*2 + fs.length)/8);
    const abandono = Math.min(1, horasSin/30);
    const escala   = Math.min(1, personas/900);
    idx = Math.round(100*(0.45*gravedad + 0.40*abandono + 0.15*escala));
    if(!ents.length && pendCrit) idx = Math.max(idx,78);
  }
  const nCoord = activos().filter(c=>c.z===z.id && c.ver).length;
  const nMicro = activos().filter(c=>c.z===z.id).length;
  return {z, idx, nCoord, nMicro, personas, ultEnt, reps:reps.length, ents:ents.length, focos:fs};
}

/* ============================================================
   AGRUPAR POR PERSONA (para la ficha: otras micro-zonas)
   ============================================================ */
const claveP = c => c.cuenta || telDigitos(c.tel) || c.tel || c.id;
function micrasDe(c){ return COORDS.filter(x=>claveP(x)===claveP(c)); }

/* ============================================================
   PINTAR
   ============================================================ */
function avatar(p, cls=''){
  if(p.foto) return `<div class="avatar ${cls}" style="background-image:url('${esc(p.foto)}')"></div>`;
  const ini=(p.nom||p.nombre||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
  return `<div class="avatar ${cls}">${esc(ini)}</div>`;
}
function estadoDe(c){ return c.anulado?'anulados' : c.ver?'autorizados' : 'esperando'; }

function coincide(c, q, qd){
  if(qd && qd.length>=3 && soloDigitos((c.tel_e164||'')+' '+(c.tel||'')).includes(qd)) return true;
  return norm([c.nom,c.micro,c.z,zonaNombre(c.z),c.rol,c.codigo,c.nota,c.email,c.tel].join(' ')).includes(q);
}

/* ---------- INICIO ---------- */
function vInicio(){
  const pend = activos().filter(c=>!c.ver);
  const orf  = huerfanos();
  const sol  = solitarios();
  const auth = activos().filter(c=>c.ver).length;
  const micro= activos().length;
  const entHoy = ENTREGAS.filter(e=>(now()-e.ts) < 24*H).length;

  let alertas = '';
  if(orf.length) alertas += `<div class="alert red">
      <div class="ti">${orf.length} punto${orf.length>1?'s':''} sin nadie a cargo</div>
      <div class="cx">${esc(orf[0].zona.n)}${orf.length>1?' y otros':''} — se reportó ayuda y nadie la cubre.</div>
      <button class="btn red" data-goto="zonas">Ver en Zonas</button></div>`;
  if(sol.length) alertas += `<div class="alert amber">
      <div class="ti">${sol.length} sector${sol.length>1?'es':''} con una sola persona</div>
      <div class="cx">${esc(sol[0].zona.n)} — solo <b>${esc(sol[0].solo.nom)}</b> a cargo. Si falla, queda ciego.</div>
      <button class="btn flat" data-goto="zonas">Ver en Zonas</button></div>`;
  const vulns = REPORTES.filter(r=>r.u===3 && (r.prioridad||[]).length && !repAtendido(r));
  if(vulns.length) alertas += `<div class="alert red">
      <div class="ti">${vulns.length} pedido${vulns.length>1?'s':''} crítico${vulns.length>1?'s':''} con personas vulnerables</div>

  const inhab = CENSO.filter(c=>c.ev==='inhabitable').length;

  if(pend.length) alertas += `<div class="alert amber">
      <div class="ti">${pend.length} ${pend.length>1?'inscripciones':'inscripción'} esperando autorización</div>
      <div class="cx">Le llegó el código por WhatsApp: búsquela y confirme que es esa persona.</div>
      <button class="btn" style="background:var(--acc)" data-goto="personas" data-seg="esperando">Revisar Personas</button></div>`;
  if(!alertas) alertas = `<div class="alert green">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <div><div class="ti">Todo al día</div><div class="cx">Cada punto reportado tiene alguien a cargo y no hay nadie esperando.</div></div></div>`;

  const movs = movimientos();
  const movHtml = movs.length ? movs.map(m=>`
    <div class="need-line">
      <span class="dot" style="background:${m.color}"></span>
      <div class="grow"><div style="font-size:13.5px">${m.txt}</div>
        <div class="cnt">${hace(m.ts)}</div></div>
    </div>`).join('') : `<div class="vacio"><b>Sin movimientos aún</b><p>Aquí van apareciendo inscripciones y entregas.</p></div>`;

  // ---- el censo de un vistazo ----
  const vivas   = CENSO.filter(c=>!c.archivada);
  const personas= vivas.reduce((a,c)=>a+(c.personas||0),0);
  const urgentes= vivas.filter(c=>c.urg===3).length;
  const porUbic = vivas.filter(c=>!c.lat).length;
  const aprox   = vivas.filter(c=>c.lat && c.aprox).length;
  const abiertos= REPORTES.filter(r=>!repAtendido(r)).length;
  const hoyISO  = new Date().toISOString().slice(0,10);
  const proximas= (JORNADAS||[]).filter(j=>(j.fecha||'') >= hoyISO).length;

  const dato = (n,t,col) => `<div class="dnum"${col?` style="--c:${col}"`:''}>
      <b>${n}</b><span>${t}</span></div>`;

  // ---- accesos directos: cada rol ve solo lo suyo ----
  const soloCenso = ROL==='censo';
  const A = [
    !soloCenso && ['pedidos','abiertos','alert', abiertos, 'Pedidos abiertos',
      abiertos ? 'Ayuda pedida que nadie ha cubierto' : 'Nada pendiente'],
    ['pedidos','censo','lista', vivas.length, 'Censo', 'Las fichas de cada familia'],
    ['ubicar','','pin', porUbic, 'Ubicar direcciones',
      porUbic ? 'Fichas sin punto en el mapa' : 'Todas ubicadas'],
    ['despachos','','ruta', proximas, 'Despachos',
      proximas ? 'Jornadas programadas' : 'Sin jornadas programadas'],
    ['reporte','','doc', null, 'Reporte del censo', 'Filtrar y revisar todo el censo'],
    !soloCenso && ['personas','esperando','gente', pend.length, 'Personas',
      pend.length ? 'Esperando autorización' : 'Coordinadoras y su estado'],
    !soloCenso && ['zonas','','capas', null, 'Zonas', 'Cobertura y desatención'],
  ].filter(Boolean);

  const ICOD = {
    alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    lista:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 5h6M9 10h6M9 14h6M9 18h3.5"/>',
    pin:'<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    ruta:'<circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="5" r="2.4"/><path d="M8.4 19h6.1a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6.1"/>',
    doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
    gente:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',

function movimientos(){
  const evs = [];
  activos().forEach(c=> evs.push({ts:c.creado, color:'#7aa7ff',
    txt:`<b>${esc(c.nom)}</b> se inscribió en ${esc(zonaNombre(c.z))}${c.ver?' · autorizada':''}`}));
  ENTREGAS.forEach(e=> evs.push({ts:e.ts, color:'#3f8f5f',
    txt:`Entrega: ${esc(NEED[e.k]?.n||e.k)} → ${esc(zonaNombre(e.z))}${e.quien?` · ${esc(e.quien)}`:''}`}));
  return evs.sort((a,b)=>b.ts-a.ts).slice(0,6);
}

/* ---------- PEDIDOS (folio + contacto privado) y CENSO ---------- */
const EV_TXT = {habitable:['Habitable','#22c55e'], danos:['Con daños','#f5a524'], inhabitable:['Inhabitable','#f87171']};
const PRIO_TXT = {ninos5:'niños <5', mayores:'adultos mayores', discapacidad:'discapacidad', embarazo:'embarazo'};

function vPedidos(){
  const sinPriv = !AKEY() && !DEMO;
  const aviso = sinPriv ? `<div class="alert amber"><div class="ti">Correo sin permiso de administración</div>
    <div class="cx">Entraste como <b>${esc(YO.email||'—')}</b>. Los teléfonos y el censo solo se muestran a los correos autorizados.</div></div>` : '';

  if(SEGP==='censo'){ return vCensoLista(aviso); }

  const abiertos = REPORTES.filter(r=>!repAtendido(r));
  const lista = (SEGP==='abiertos' ? abiertos : REPORTES.filter(r=>repAtendido(r)))
    .sort((a,b)=> (b.u-a.u) || (b.ts-a.ts)).slice(0,120);

  const filas = lista.map(r=>{
    const cont = CONTACTOS[r.folio];
    const prio = (r.prioridad||[]).map(k=>PRIO_TXT[k]||k).filter(Boolean);
    return `<div class="prow ${r.u===3?'pendiente':''}">
      <div class="info" data-pedido="${esc(r.id)}">
        <div class="nm">${esc(NEED[r.k]?.n||r.k)}${r.personas?` · ${r.personas}p`:''}
          <span class="sbadge ${r.u===3?'b3':r.u===2?'b2':'b1'}" style="margin-left:4px">${r.u===3?'Crítico':r.u===2?'Urgente':'Puede esperar'}</span></div>
        <div class="mt">${esc(zonaNombre(r.z))}${r.ref?` · ${esc(r.ref)}`:''} · ${hace(r.ts)}</div>
        ${prio.length?`<div class="mt" style="color:#f5a524">Prioridad: ${esc(prio.join(', '))}</div>`:''}
        ${r.folio?`<div class="cd">${esc(r.folio)}${cont?` · ${esc(cont.nombre||'')}`:''}</div>`:''}
      </div>
      ${cont&&cont.tel?`<a class="waq" href="${waLink(cont.tel,'Hola, le escribo de Aquí Estamos por su pedido '+r.folio)}" target="_blank" rel="noopener">${WA_SVG}</a>`:''}
      <button class="chev" data-pedido="${esc(r.id)}">›</button>
    </div>`;
  }).join('') || `<div class="vacio"><b>${SEGP==='abiertos'?'Sin pedidos abiertos':'Nada atendido todavía'}</b><p>${SEGP==='abiertos'?'Cuando alguien pida ayuda aparece aquí.':'Al registrar entregas, los pedidos pasan a esta lista.'}</p></div>`;

  $('#v-pedidos').innerHTML = `${aviso}
    <div class="seg" id="segp">
      ${ROL==='censo'?'':`<button data-sp="abiertos" class="${SEGP==='abiertos'?'on':''}">Abiertos <span class="c">${abiertos.length}</span></button>
      <button data-sp="atendidos" class="${SEGP==='atendidos'?'on':''}">Atendidos</button>`}
      <button data-sp="censo" class="${SEGP==='censo'?'on':''}">Censo <span class="c">${CENSO.length}</span></button>
    </div>
    ${filas}`;
}

let CFIL = {u:0, ubicar:false, red:'', q:'', arch:false};
function vCensoLista(aviso){
  const inhab = CENSO.filter(c=>c.ev==='inhabitable');
  const sinUbicar = CENSO.filter(c=>!c.lat);
  const aproxN = CENSO.filter(c=>c.lat && c.aprox);
  const redes = [...new Set(CENSO.map(c=>c.red).filter(Boolean))].sort();
  let lista = CENSO.filter(c=>CFIL.arch ? c.archivada : !c.archivada);
  // buscar por lo que la persona tenga a mano: nombre, cédula, celular,
  // folio o barrio. Sin tildes ni mayúsculas, para que "GOMEZ" encuentre "Gómez".
  if(CFIL.q){
    const q = norma(CFIL.q);
    lista = lista.filter(c=>[c.nombre,c.cedula,c.tel,c.ficha,c.barrio,c.dir,c.red]
      .some(x=>norma(x).includes(q)));
  }
  if(CFIL.u) lista = lista.filter(c=>c.urg===CFIL.u);
  if(CFIL.ubicar==='sin') lista = lista.filter(c=>!c.lat);
  if(CFIL.ubicar==='aprox') lista = lista.filter(c=>c.lat && c.aprox);
  if(CFIL.red) lista = lista.filter(c=>c.red===CFIL.red);
  const filas = lista.sort((a,b)=> (b.urg||0)-(a.urg||0) || (a.ev==='inhabitable'?-1:0)-(b.ev==='inhabitable'?-1:0) || b.ts-a.ts)
    .slice(0,200).map(c=>{
    const ev = EV_TXT[c.ev]||null;
    return `<div class="prow ${c.ev==='inhabitable'?'pendiente':''}">
      <div class="info" data-vivienda="${esc(c.id)}">
        <div class="nm">${esc(c.nombre||('Vivienda '+(c.ficha||'')))}${c.personas?` · ${c.personas}p`:''}
          ${ev?`<span class="sbadge" style="margin-left:4px;background:${ev[1]}22;color:${ev[1]}">${ev[0]}</span>`:''}</div>
        <div class="mt">${esc(c.barrio||'—')}${c.dir?` · ${esc(c.dir)}`:''} · ${hace(c.ts)}</div>
        <div class="mt">${esc((c.needs||[]).join(', ')||'sin necesidades')}</div>
        ${c.ficha?`<div class="cd">${esc(c.ficha)}</div>`:''}
        ${c.urg?`<span class="sbadge ${c.urg===3?'b3':c.urg===2?'b2':'b1'}" style="margin-top:3px">${c.urg===3?'Urgente':c.urg===2?'Prioritaria':'Programable'}</span>`:''}
        ${(!c.lat||c.aprox)?`<button type="button" class="sbadge irubicar" data-ir-ubicar="${esc(c.id)}"
          title="Abrir en Ubicar">${c.lat?'ubicación aprox.':'sin ubicar'} · ubicar ahora</button>`:''}
      </div>
      ${c.tel && (!c.lat||c.aprox) ? `<a class="waq" style="background:#7c3aed" title="Pedir ubicación"
        href="${waLink(c.tel, msgUbicar(c))}"
        target="_blank" rel="noopener">${WA_SVG}</a>` : (c.tel?`<a class="waq" href="${waLink(c.tel,'Hola, le escribo de Aquí Estamos por el censo '+c.ficha)}" target="_blank" rel="noopener">${WA_SVG}</a>`:'')}
      <button class="chev" data-vivienda="${esc(c.id)}">›</button>
    </div>`;
  }).join('') || `<div class="vacio"><b>Sin viviendas${AKEY()||DEMO?'':' visibles'}</b><p>${AKEY()||DEMO?'Cuando se registre una vivienda en el censo aparece aquí.':'Solo los correos autorizados ven el censo completo.'}</p></div>`;

  $('#v-pedidos').innerHTML = `${aviso}
    <div class="seg" id="segp">
      ${ROL==='censo'?'':`<button data-sp="abiertos">Abiertos</button>
      <button data-sp="atendidos">Atendidos</button>`}
      <button data-sp="censo" class="on">Censo <span class="c">${CENSO.length}</span></button>
    </div>
    <div class="buscabox" style="margin-top:10px">
      <input id="cbusca" placeholder="Buscar por nombre, cédula, celular, ficha o barrio"
        value="${esc(CFIL.q)}" autocomplete="off">
    </div>
    ${CFIL.q?`<p class="muted" style="margin:8px 3px 0;font-size:12.5px">${lista.length} resultado${lista.length===1?'':'s'} para “${esc(CFIL.q)}”</p>`:''}
    ${inhab.length?`<div class="alert red"><div class="ti">${inhab.length} vivienda${inhab.length>1?'s':''} inhabitable${inhab.length>1?'s':''}</div>
      <div class="cx">Familias durmiendo fuera — en cola de evaluación estructural.</div></div>`:''}
    <div class="seg" id="cfil" style="margin-top:10px">
      <button data-cf="u3" class="${CFIL.u===3?'on':''}">Urgentes</button>
      <button data-cf="sin" class="${CFIL.ubicar==='sin'?'on':''}">Sin ubicar <span class="c">${sinUbicar.length}</span></button>
      <button data-cf="aprox" class="${CFIL.ubicar==='aprox'?'on':''}">Aprox. <span class="c">${aproxN.length}</span></button>
      <button data-cf="arch" class="${CFIL.arch?'on':''}">Archivadas <span class="c">${CENSO.filter(c=>c.archivada).length}</span></button>
      ${redes.length?`<select id="cfil-red" class="selred"><option value="">Toda red/iglesia</option>
        ${redes.map(r=>`<option ${CFIL.red===r?'selected':''}>${esc(r)}</option>`).join('')}</select>`:''}
    </div>
    ${filas}`;
  document.querySelectorAll('#cfil [data-cf]').forEach(b=>b.onclick=()=>{
    if(b.dataset.cf==='u3') CFIL.u = CFIL.u===3?0:3;
    if(b.dataset.cf==='arch') CFIL.arch = !CFIL.arch;
    if(b.dataset.cf==='sin') CFIL.ubicar = CFIL.ubicar==='sin'?false:'sin';
    if(b.dataset.cf==='aprox') CFIL.ubicar = CFIL.ubicar==='aprox'?false:'aprox';
    render();
  });
  const sr=document.getElementById('cfil-red');
  if(sr) sr.onchange=()=>{ CFIL.red=sr.value; render(); };
}

  ['ropa','Carpas / cobijas'],['bebes','Pañales'],['aseo','Aseo'],['albergue','Albergue'],
  ['arriendo','Arriendo'],['estructural','Evaluación'],
  ['servicios','Servicios públicos'],['movilidad','Movilidad / silla de ruedas'],

const hoyISO = () => new Date(now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

/* Guardar la jornada: las rutas dejan de vivir solo en la pantalla. Las
   paradas se copian tal cual, para que la hoja que recibió el equipo siga
   diciendo lo mismo aunque mañana cambie el censo. */
async function dpGuardar(){
  const rutas = DP.rutas||[]; if(!rutas.length) return toast('No hay rutas que guardar.');
  const fecha = (document.getElementById('dp-fecha')||{}).value || hoyISO();
  const titulo = ((document.getElementById('dp-titulo')||{}).value||'').trim();
  const b = document.getElementById('dp-guardar'); b.disabled=true; b.textContent='Guardando…';
  const cab = {fecha, titulo:titulo||null, tipo:DP.tipo, equipos:DP.equipos, tope:DP.tope,
    unidades:DP.unidades, creada_por:(YO.email||''),
    reglas:{prioridades:[...DP.reglas], soloPidieron:!DP.todas, incluirAprox:DP.incluirAprox,
            fuentes:{censo:DP.fuenteCenso!==false, reportes:!!DP.conReportes}}};
  if(DEMO){
    let nid=0;
    const ps = rutas.flatMap(r=>r.paradas.map((x,j)=>({id:'dp'+(++nid), equipo:r.equipo, orden:j+1,
      nombre:x.c.nombre, direccion:x.c.dir, barrio:x.c.barrio, tel_e164:x.c.tel,
      personas:x.c.personas, lat:x.c.lat, lng:x.c.lng, folio:x.c.ficha,
      motivo:(x.por||[]).join(' · '), entregada:false})));
    JORNADAS.unshift({...cab, id:'demo'+Date.now(), estado:'programada', paradas:ps});
    toast('Jornada guardada (demo).'); DP.paso=5; vDespachos(); return;
  }
  const {data, error} = await db.from('jornadas').insert(cab).select('id').single();
  if(error){ toast('No se pudo guardar la jornada.'); console.error(error);
    b.disabled=false; b.textContent='Guardar la jornada'; return; }
  const paradas = rutas.flatMap(r=>r.paradas.map((x,j)=>({
    jornada_id:data.id, equipo:r.equipo, orden:j+1,
    censo_id: String(x.c.id).startsWith('rep:') ? null : x.c.id,
    folio:x.c.ficha||null, nombre:x.c.nombre||null, direccion:x.c.dir||null, barrio:x.c.barrio||null,
    tel_e164:x.c.tel||null, personas:x.c.personas||0, lat:x.c.lat, lng:x.c.lng,
    motivo:(x.por||[]).join(' · ')||null })));
  const {error:e2} = await db.from('jornada_paradas').insert(paradas);
  if(e2){ toast('La jornada se creó pero fallaron las paradas.'); console.error(e2); }
  toast('Jornada guardada para el '+fecha);
  await cargarJornadas(); DP.paso=5; vDespachos();
}

let JORNADAS = [];
async function cargarJornadas(){
  if(DEMO) return;
  const {data} = await db.from('jornadas').select('*').order('fecha',{ascending:false}).limit(100);
  JORNADAS = data||[];
  for(const j of JORNADAS){
    const {data:ps} = await db.from('jornada_paradas').select('*')
      .eq('jornada_id', j.id).order('equipo').order('orden');
    j.paradas = ps||[];
  }
}

/* Mapa de la ruta: la línea numerada dice de un vistazo si el recorrido tiene
   sentido. Se dibuja solo al desplegar el equipo, no antes. */
function jPintarMapas(j){
  if(!window.L) return;
  [...JEQ].forEach(n=>{
    const el = document.getElementById('jmap-'+n); if(!el) return;
    if(JMAPS[n]){ JMAPS[n].remove(); delete JMAPS[n]; }
    const ps = j.paradas.filter(p=>p.equipo===n && p.lat && p.lng);
    if(!ps.length) return;
    const m = L.map(el, {zoomControl:true, attributionControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:19, subdomains:'abcd'}).addTo(m);
    const pts = ps.map(p=>[p.lat,p.lng]);
    L.polyline(pts, {color:'#4F9CF9', weight:4, opacity:.85}).addTo(m);
    ps.forEach((p,k)=>{
      L.marker([p.lat,p.lng], {icon: L.divIcon({className:'', iconSize:[26,26], iconAnchor:[13,13],
        html:`<div class="pinnum ${p.entregada?'ok':''}">${k+1}</div>`})})
       .addTo(m).bindPopup(`<b>${esc(p.nombre||'')}</b><br>${esc(p.barrio||'')}${p.direccion?' · '+esc(p.direccion):''}`);
    });
    m.fitBounds(L.latLngBounds(pts).pad(0.18));
    JMAPS[n] = m;
    if(window.ResizeObserver) new ResizeObserver(()=>m.invalidateSize()).observe(el);
    setTimeout(()=>m.invalidateSize(), 80);
  });
}

/* ============================================================
   REPORTE DEL CENSO
   ============================================================
   Buscar y filtrar para encontrar lo crítico sin tener que armarlo a mano.
   El buscador vive en la barra; los filtros en una ventana que se cierra al
   aplicar, para que la lista quede a la vista. Disponible para los dos roles.
   ============================================================ */
let REP = { q:'', urg:new Set(), cond:new Set(), nec:new Set(), est:new Set(),
            barrio:'', red:'', col:'urgencia', dir:-1, ver:40, modal:false };

const REP_COND = [['grave','Enfermedad grave'],['embarazo','Embarazo o lactancia'],
  ['discapacidad','Discapacidad'],['sensorial','Auditiva o visual'],['cronica','Crónica'],
  ['sin_empleo','Sin empleo'],['menores','Menores de 5'],['mayores','Mayores de 65']];
const REP_EST = [['exacta','Dirección exacta'],['parcial','Ubicación parcial'],
  ['sin','Sin ubicar'],['nunca','Nunca ha recibido'],['viejo','Recibió hace +7 días']];

const repVivas = () => CENSO.filter(c=>!c.archivada);
function repUltima(c){
  if(!c.lat) return null;
  const e = ENTREGAS.filter(y=>y.lat && distM(c.lat,c.lng,+y.lat,+y.lng)<300)
                    .sort((a,b)=>b.ts-a.ts)[0];
  return e ? e.ts : null;
}
function repEstado(c){
  return !c.lat ? 'sin' : (c.aprox ? 'parcial' : 'exacta');
}
function repVulnerable(c){
  return (c.cond||[]).some(k=>['grave','embarazo','discapacidad','sensorial'].includes(k));
}
function repCriticos(){
  return repVivas().filter(c=>c.urg===3 && repVulnerable(c) && !repUltima(c));
}

function repFiltrar(){
  const q = norma(REP.q);
  return repVivas().filter(c=>{
    if(q && ![c.nombre,c.cedula,c.tel,c.ficha,c.barrio,c.dir,c.red]
        .some(x=>norma(x).includes(q))) return false;
    if(REP.urg.size && !REP.urg.has(String(c.urg||0))) return false;
    if(REP.barrio && norma(c.barrio)!==norma(REP.barrio)) return false;
    if(REP.red && norma(c.red)!==norma(REP.red)) return false;
    if(REP.nec.size && ![...REP.nec].some(k=>(c.needs||[]).includes(k))) return false;
    if(REP.cond.size){
      const ok = [...REP.cond].some(k=>
        k==='__vuln'  ? repVulnerable(c)
        : k==='menores' ? (c.men5>0) : k==='mayores' ? (c.may65>0) : (c.cond||[]).includes(k));
      if(!ok) return false;
    }
    if(REP.est.size){
      const e = repEstado(c), u = repUltima(c);
      const ok = [...REP.est].some(k=>
        k==='nunca' ? !u : k==='viejo' ? (u && now()-u > 7*24*H) : e===k);
      if(!ok) return false;
    }
    return true;
  });
}

function repOrdenar(lista){
  const val = c => ({
    familia: norma(c.nombre), barrio: norma(c.barrio), personas: c.personas||0,
    urgencia: (c.urg||0)*10 + (repVulnerable(c)?5:0) + ((c.cond||[]).length),
    cond: (c.cond||[]).length, nec: (c.needs||[]).length,
    ubic: {exacta:3, parcial:2, sin:1}[repEstado(c)],
    entrega: repUltima(c) || 0,
  })[REP.col];
  return lista.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x===y) return norma(a.nombre).localeCompare(norma(b.nombre));
    return (x>y?1:-1) * REP.dir;
  });
}

/* ============================================================
   UBICAR — cola de direcciones, una por una
   ============================================================
   La ficha del formulario trae una dirección escrita, no un punto. Aquí se
   convierte en coordenada: se propone un punto con el geocodificador, la
   persona lo confirma o lo arrastra, y queda guardado como ubicación real.
   Primero las que no tienen ningún punto; después las aproximadas.
   ============================================================ */
let UB = { i:0, lat:null, lng:null, map:null, mk:null, modo:'sin', q:'', suelta:null };

/* Atajo desde la lista: abre esa ficha exacta en la cola de Ubicar, en la
   pestaña que le corresponde (sin punto o aproximada). */
function abrirEnUbicar(id){
  const c = CENSO.find(x=>String(x.id)===String(id)); if(!c) return;
  UB.q = ''; UB.suelta = null;
  UB.modo = c.lat && c.aprox ? 'aprox' : 'sin';
  ir('ubicar');
  const i = ubCola().findIndex(x=>String(x.id)===String(id));
  if(i>=0){ UB.i = i; }
  else { UB.suelta = c.id; }   // ya ubicada: se abre igual, para revisar o corregir
  vUbicar();
}

function ubCola(){
  const reps       = dpReportes();
  const censoVivas = CENSO.filter(c=>!c.archivada).length;
  const repsN      = reps.length;
  const vivas = (DP.fuenteCenso===false?[]:CENSO).filter(c=>!c.archivada).concat(reps);
  const lista = UB.modo==='aprox' ? vivas.filter(c=>c.lat && c.aprox) : vivas.filter(c=>!c.lat);
  // lo aplazado vuelve al final, no al frente: si no, las fichas imposibles
  // reaparecen en cada vuelta y el trabajo no avanza nunca.
  return lista.sort((a,b)=>(a.saltadaEl||0)-(b.saltadaEl||0));
}

/* Buscar mira todo el censo, no solo la pestaña abierta: quien busca "hugo"
   no sabe —ni tiene por qué— si esa ficha está sin ubicar o aproximada. */
/* Barrios que ya tienen al menos una vivienda ubicada: sirven de referencia
   para llevar el mapa cerca cuando la dirección no dice nada al geocodificador. */
/* A qué comuna pertenece cada barrio. Sale de lo que devuelve OpenStreetMap
   al consultar cada barrio como lugar, y de la nomenclatura de la Alcaldía
   (Guayabal es de Villa Santana, no de Dosquebradas). Sirve para preseleccionar
   la comuna y llevar el mapa cerca cuando la ficha solo dice el barrio. */
const BARRIO_COMUNA = {
  'guayabal':'villa santana', 'tokio':'villa santana', 'el chocho':'villa santana',
  'nuevo plan':'villa santana', 'las brisas':'villa santana', 'el danubio':'villa santana',
  'monserrate':'villa santana', 'intermedio':'villa santana', 'veracruz':'villa santana',
  'samaria':'el poblado', 'perla del otun':'el poblado',
  'rocio alto':'el rocio', 'el rocio':'el rocio',
  'restrepo':'consota', 'el restrepo':'consota', 'miraflores':'consota',
  'quintas de los sauces':'el oso', 'sauces':'el oso', 'el oso':'el oso',
  'bello horizonte':'san joaquin',
  'san carlos':'arabia', 'san juan':'rio otun', 'corosito':'rio otun',
  'lago uribe':'centro', 'san nicolas':'centro', 'centro':'centro',
  'pueblito paisa':'cuba', 'naranjal':'cuba', 'san fernando':'cuba', 'cuba':'cuba',
};
/* El barrio suele venir dentro del texto de la dirección ("Samaria 2 casa 8
   manzana 35") y no en su propio campo. Se busca ahí también, contra los
   barrios conocidos y contra los que ya tienen viviendas ubicadas. */
function barrioDeTexto(c){
  if(c.barrio && c.barrio.trim()) return c.barrio.trim();
  const t = norma((c.dir||'') + ' ' + (c.detalle||''));
  if(!t.trim()) return '';
  const cands = [...Object.keys(BARRIO_COMUNA), ...barriosConocidos().map(b=>norma(b.n)),
                 ...(ZONAS||[]).map(z=>norma(z.n))];
  let mejor = '';
  cands.forEach(k=>{ const kk=k.trim();
    if(kk.length>3 && t.includes(kk) && kk.length>mejor.length) mejor=kk; });
  if(!mejor) return '';
  // devolver el nombre con su escritura bonita
  const z = (ZONAS||[]).find(x=>norma(x.n)===mejor);
  if(z) return z.n;
  const b = barriosConocidos().find(x=>norma(x.n)===mejor);
  if(b) return b.n;
  return mejor.replace(/\b\w/g, m=>m.toUpperCase());
}

function comunaDeBarrio(barrio){
  const b = norma(barrio||'').trim(); if(!b) return null;
  for(const [k,v] of Object.entries(BARRIO_COMUNA))
    if(b.includes(k)) return (ZONAS||[]).find(z=>norma(z.n)===v) || null;
  return (ZONAS||[]).find(z=>b.includes(norma(z.n))) || null;
}

/* La nomenclatura de Pereira ubica sola: el damero del Centro va de la calle
   14 a la 26 con carreras 4 a 12. "Calle 26 #5-28" es Centro aunque no nombre
   ningún barrio. */
function comunaPorNomenclatura(c){
  // "Calle 16 No 4-20", "Cra 3 # 26-74", "K31 # 15_47": el separador de la
  // placa viene escrito de muchas formas y hay que quitarlo antes de leer.
  const t = norma(c.dir||'').replace(/\b(no|nro|num|numero)\b\.?/g,' ').replace(/[#°]/g,' ');
  const m = t.match(/(calle|carrera|cra|cll|cl|kra|kr|k)\s*(\d{1,3})\s*[a-z]?\s*(?:bis)?\s*(\d{1,3})/);
  if(!m) return null;
  const via = m[1].startsWith('c') && !m[1].startsWith('cr') ? 'calle' : 'carrera';
  const n1 = +m[2], n2 = +m[3];
  const calle   = via==='calle'   ? n1 : n2;
  const carrera = via==='carrera' ? n1 : n2;
  if(calle>=8 && calle<=30 && carrera>=3 && carrera<=13)
    return (ZONAS||[]).find(z=>norma(z.n)==='centro') || null;
  return null;
}

/* Comuna de una ficha, del dato más firme al más flojo: barrio nombrado,
   nomenclatura del Centro, y de última el punto en el mapa — que solo se usa
   si una comuna queda claramente más cerca que la siguiente, porque en el
   centro de Pereira los centroides están a 300 m unos de otros. */
function comunaDeFicha(c){
  const z = comunaDeBarrio(barrioDeTexto(c));
  if(z) return {z, via:'barrio'};
  const zn = comunaPorNomenclatura(c);
  if(zn) return {z:zn, via:'nomenclatura'};
  if(c.lat && c.lng){
    const d = (ZONAS||[]).map(x=>({x, m:distM(c.lat,c.lng,x.lat,x.lng)})).sort((a,b)=>a.m-b.m);
    if(d.length && d[0].m < 4000 && (d.length===1 || d[1].m - d[0].m > 250))
      return {z:d[0].x, via:'ubicación'};
    if(d.length>1 && d[0].m < 2000) return {z:d[0].x, via:'dudosa', otras:d.slice(1,3).map(o=>o.x.n)};
  }
  return null;
}

/* Mejor punto disponible para un barrio: primero el promedio de las viviendas
   ya ubicadas en ese mismo barrio (lo más fiel), después la comuna. */
function puntoDeBarrio(c){
  const bar = barrioDeTexto(c);
  c = {...c, barrio: bar};
  if(!c.barrio) {
    const z0 = comunaDeBarrio(c.barrio);
    return z0 ? {n:z0.n, lat:z0.lat, lng:z0.lng, tipo:'comuna'} : null;
  }
  const k = norma(c.barrio);
  const pares = CENSO.filter(x=>x.lat && !x.aprox && norma(x.barrio)===k);
  if(pares.length) return {n:c.barrio, tipo:'barrio',
    lat: pares.reduce((a,x)=>a+x.lat,0)/pares.length,
    lng: pares.reduce((a,x)=>a+x.lng,0)/pares.length};
  const cf = comunaDeFicha(c);
  return cf ? {n:'la comuna '+cf.z.n, lat:cf.z.lat, lng:cf.z.lng, tipo:'comuna'} : null;
}

async function ubBarrioMinimo(c){
  const p = puntoDeBarrio(c); if(!p) return;
  const antes = {lat:c.lat, lng:c.lng, aprox:c.aprox};
  if(!DEMO){
    const {error} = await db.from('censo').update({lat:p.lat, lng:p.lng, ubicacion_aprox:true,
      ubicado_por:'panel:'+(YO.email||'')+' · '+p.tipo}).eq('id', c.id);
    if(error){ toast('No se pudo guardar.'); return; }
  }
  c.lat=p.lat; c.lng=p.lng; c.aprox=true;
  toastDeshacer(`Ubicada en ${p.n} — aproximada, sigue en la cola de parciales`, async ()=>{
    if(!DEMO) await db.from('censo').update({lat:antes.lat, lng:antes.lng,
      ubicacion_aprox:antes.aprox}).eq('id', c.id);
    Object.assign(c, antes); vUbicar(); render();
  });
  vUbicar(); render();
}

function barriosConocidos(){
  const g = {};
  CENSO.forEach(c=>{
    if(!c.barrio || !c.lat) return;
    const k = norma(c.barrio);
    (g[k] = g[k] || {n:c.barrio.trim(), pts:[]}).pts.push([c.lat, c.lng]);
  });
  return Object.values(g).map(x=>({
    n: x.n, n2: x.pts.length>1 ? x.pts.length+' viviendas' : '',
    lat: x.pts.reduce((a,p)=>a+p[0],0)/x.pts.length,
    lng: x.pts.reduce((a,p)=>a+p[1],0)/x.pts.length,
  })).sort((a,b)=>a.n.localeCompare(b.n));
}

function ubBuscar(){
  const q = norma(UB.q); if(!q) return [];
  return CENSO.filter(c=>!c.archivada)
    .filter(c=>[c.nombre,c.cedula,c.tel,c.ficha,c.barrio,c.dir].some(x=>norma(x).includes(q)))
    .slice(0,30);
}
