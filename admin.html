/* mapa de la ficha en curso */
// Centro por ciudad: si la ficha dice Dosquebradas, empezar en Pereira obliga
// a un viaje de mapa que el formulario ya había evitado.
const CIUDADES = {
  'pereira':[4.8133,-75.6961,13], 'dosquebradas':[4.8339,-75.6713,13],
  'la virginia':[4.8994,-75.8836,14], 'santa rosa':[4.8687,-75.6249,13],
  'santa rosa de cabal':[4.8687,-75.6249,13], 'cartago':[4.7460,-75.9115,13],
  'marsella':[4.9364,-75.7396,14], 'apia':[5.1063,-75.9411,14],
};
function centroCiudad(nom){
  const k = norma(nom||'');
  for(const [c,v] of Object.entries(CIUDADES)) if(k.includes(c)) return v;
  return CIUDADES['pereira'];
}

function ubMapa(c){
  const el = document.getElementById('ubmapa'); if(!el || !window.L) return;
  UB.lat = c.lat ?? null; UB.lng = c.lng ?? null; UB.mk = null;
  if(UB.ref){ UB.ref.remove(); UB.ref = null; }   // referencia de la ficha anterior
  const cerca = document.getElementById('ub-cerca'); if(cerca) cerca.innerHTML = '';
  const lug = document.getElementById('ub-lugares'); if(lug) lug.innerHTML = '';
  clearTimeout(_cercaT);
  if(UB.map){ UB.map.remove(); UB.map=null; }
  const z = (comunaDeFicha(c)||{}).z;
  const cc = centroCiudad(c.ciudad);
  const base = c.lat ? [c.lat, c.lng, 16] : (z ? [z.lat, z.lng, 15] : cc);
  UB.map = L.map(el, {zoomControl:true, attributionControl:false})
            .setView([base[0], base[1]], base[2]);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {maxZoom:19, subdomains:'abcd'}).addTo(UB.map);
  // El contenedor toma su alto con el layout, después de crear el mapa: sin
  // esto Leaflet calcula 0 y no pide una sola tesela (mapa en blanco).
  setTimeout(()=>UB.map && UB.map.invalidateSize(), 60);
  if(window.ResizeObserver){
    if(ubMapa._ro) ubMapa._ro.disconnect();
    ubMapa._ro = new ResizeObserver(()=>{ if(UB.map) UB.map.invalidateSize(); });
    ubMapa._ro.observe(el);
  } else {
    window.addEventListener('resize', ()=>{ clearTimeout(ubMapa._r);
      ubMapa._r = setTimeout(()=>UB.map && UB.map.invalidateSize(), 180); });
  }
  if(c.lat){
    ubFijar(c.lat, c.lng, false);
    if(c.aprox){
      // un punto de barrio no es una casa: se dibuja el radio de incertidumbre
      L.circle([c.lat,c.lng], {radius:400, color:'#7C3AED', weight:1.5,
        dashArray:'5 5', fillOpacity:.07}).addTo(UB.map);
    }
  }
  UB.map.on('click', e=>ubFijar(e.latlng.lat, e.latlng.lng));
}
function ubFijar(la, lo, habilita=true){
  UB.lat=+(+la).toFixed(6); UB.lng=+(+lo).toFixed(6);
  const PIN = L.divIcon({className:'', iconSize:[34,42], iconAnchor:[17,38], html:
    `<svg viewBox="0 0 24 24" width="34" height="42" style="filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" fill="#7C3AED" stroke="#fff" stroke-width="1.6"/>
      <circle cx="12" cy="10" r="3" fill="#fff"/></svg>`});
  if(UB.mk) UB.mk.setLatLng([UB.lat,UB.lng]);
  else { UB.mk = L.marker([UB.lat,UB.lng],{draggable:true, icon:PIN}).addTo(UB.map);
    UB.mk.on('dragend', e=>{ const p=e.target.getLatLng(); ubFijar(p.lat,p.lng); }); }
  const b=document.getElementById('ub-guardar');
  if(b && habilita) b.disabled=false;
  if(habilita) ubCercanas(UB.lat, UB.lng);
}

/* Geocodificación: la dirección escrita se busca en Nominatim, acotada a
   Risaralda. Si el resultado cae fuera de la caja de Pereira se descarta:
   más vale no proponer nada que mandar la brigada a otro municipio. */
/* Acepta lo que la gente realmente tiene a mano: un par de coordenadas, un
   enlace de Google Maps o el de WhatsApp. Es también la única forma de fijar
   el punto sin ratón: antes, sin mouse la tarea era imposible. */
function ubPegar(){
  const t = ((document.getElementById('ub-coord')||{}).value||'').trim();
  const msg = document.getElementById('ubmsg');
  if(!t){ msg.textContent='Pega el enlace o las coordenadas primero.'; return; }
  let la=null, lo=null;
  let m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)                 // google maps /@lat,lng
       || t.match(/[?&](?:q|ll|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) // ...?q=lat,lng
       || t.match(/^\s*(-?\d+\.\d+)\s*[,;\s]\s*(-?\d+\.\d+)\s*$/);  // "4.813, -75.696"
  if(m){ la=+m[1]; lo=+m[2]; }
  if(la==null){ msg.textContent='No reconocí una ubicación ahí. Pega el enlace completo o escribe "4.813, -75.696".'; return; }
  if(!(la>4.60 && la<5.10 && lo>-76.10 && lo<-75.40)){
    msg.textContent='Esa ubicación queda fuera de Pereira y alrededores. Revísala antes de guardarla.'; return; }
  UB.map.setView([la,lo], 17); ubFijar(la,lo);
  msg.textContent='Punto puesto donde indica el enlace. Verifícalo en el mapa.';
}

/* Referencia por lugar conocido: la dirección puede no existir en el mapa,
   pero la tienda de la esquina sí. Se buscan lugares con nombre alrededor de
   la ciudad de la ficha y se lleva el mapa allí; el pin lo pone la persona. */
/* Al poner el pin, buscar qué direcciones hay registradas alrededor. No
   inventa la dirección: muestra las placas vecinas con su distancia, para que
   la persona reconozca la cuadra o la copie si es la misma casa. */
let _cercaT = null;
function ubCercanas(la, lo){
  clearTimeout(_cercaT);
  _cercaT = setTimeout(async ()=>{
    const w = document.getElementById('ub-cerca'); if(!w) return;
    w.innerHTML = '<p class="muted" style="margin:8px 3px 0;font-size:12px">Buscando direcciones vecinas…</p>';
    const q = `[out:json][timeout:25];(node["addr:housenumber"](around:150,${la},${lo});`
            + `way["addr:housenumber"](around:150,${la},${lo}););out center 12;`;
    // Overpass devuelve un XML de error cuando está saturado: un reintento
    // corto resuelve la mayoría de esos casos.
    let j = null;
    for(let intento=0; intento<2 && !j; intento++){
      try{
        const r = await fetch('https://overpass-api.de/api/interpreter',
          {method:'POST', body:'data='+encodeURIComponent(q),
           headers:{'Content-Type':'application/x-www-form-urlencoded'}});
        const txt = await r.text();
        if(txt.trim().startsWith('{')) j = JSON.parse(txt);
        else if(intento===0) await new Promise(z=>setTimeout(z,1200));
      }catch(_){ if(intento===0) await new Promise(z=>setTimeout(z,1200)); }
    }
    if(!j){ w.innerHTML = '<p class="muted" style="margin:8px 3px 0;font-size:12px">El mapa de direcciones no respondió. El punto igual se puede guardar.</p>'; return; }
    try{
      const hits = (j.elements||[]).map(e=>{
        const t=e.tags||{}, y=e.lat ?? (e.center||{}).lat, x=e.lon ?? (e.center||{}).lon;
        if(y==null) return null;
        const txt = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' #').replace('##','#');
        return txt ? {txt, n:t.name||'', m:Math.round(distM(la,lo,y,x))} : null;
      }).filter(Boolean).sort((a,b)=>a.m-b.m).slice(0,3);
      w.innerHTML = hits.length
        ? `<div class="lbl" style="margin-top:12px">Direcciones registradas cerca del pin</div>`
          + hits.map(h=>`<button type="button" class="lugar" data-usar-dir="${esc(h.txt)}">
              <b>${esc(h.txt)}</b><small>${h.n?esc(h.n)+' · ':''}a ${h.m} m del pin — tócala para copiarla a la dirección</small></button>`).join('')
        : `<p class="muted" style="margin:8px 3px 0;font-size:12px">No hay direcciones registradas cerca de este punto en el mapa.</p>`;
    }catch(e){ w.innerHTML=''; }
  }, 700);   // esperar a que la persona termine de arrastrar
}

async function ubLugar(c){
  const q = ((document.getElementById('ub-lugar')||{}).value||'').trim();
  const w = document.getElementById('ub-lugares'); if(!q || !w) return;
  const b = document.getElementById('ub-buscarlugar'); b.disabled=true; b.textContent='…';
  w.innerHTML = '<p class="muted" style="margin:8px 3px;font-size:12.5px">Buscando lugares…</p>';
  const cc = centroCiudad(c.ciudad);
  try{
    const u = 'https://photon.komoot.io/api/?limit=6&lang=es&lat='+cc[0]+'&lon='+cc[1]
            + '&q=' + encodeURIComponent(q + ' ' + (c.ciudad||'Pereira'));
    const j = await (await fetch(u)).json();
    const hits = (j.features||[]).map(f=>({
      lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0],
      n:f.properties.name||'', d:[f.properties.street, f.properties.district, f.properties.city]
        .filter(Boolean).join(' · ')
    })).filter(x=>x.lat>4.60 && x.lat<5.10 && x.lng>-76.10 && x.lng<-75.40);
    w.innerHTML = hits.length
      ? hits.map(h=>`<button type="button" class="lugar" data-ir-lugar="${h.lat},${h.lng}">
          <b>${esc(h.n)}</b><small>${esc(h.d||'sin dirección registrada')}</small></button>`).join('')
      : '<p class="muted" style="margin:8px 3px;font-size:12.5px">No se encontró ese lugar. Prueba con otro nombre cercano.</p>';
  }catch(e){
    w.innerHTML = '<p class="muted" style="margin:8px 3px;font-size:12.5px">No se pudo consultar. Revisa la conexión.</p>';
  }
  b.disabled=false; b.textContent='Ir';
}

async function ubGeocodificar(c){
  const msg = document.getElementById('ubmsg');
  const partes = [c.dir, c.barrio, c.ciudad||'Pereira', 'Risaralda, Colombia'].filter(Boolean);
  if(!c.dir && !c.barrio){ msg.textContent='Esta ficha no trae dirección escrita: pídela por WhatsApp.'; return; }
  const b=document.getElementById('ub-geo'); b.disabled=true; b.textContent='Buscando…';
  try{
    const u = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=co&q='
            + encodeURIComponent(partes.join(', '));
    const r = await fetch(u, {headers:{'Accept-Language':'es'}});
    const j = await r.json();
    const p = j && j[0];
    const dentro = p && +p.lat>4.60 && +p.lat<5.10 && +p.lon>-76.10 && +p.lon<-75.40;
    if(dentro){
      UB.map.setView([+p.lat, +p.lon], 17);
      ubFijar(+p.lat, +p.lon);
      msg.innerHTML = `Propuesta: <b>${esc((p.display_name||'').split(',').slice(0,3).join(','))}</b>.
        Verifica en el mapa y arrastra el pin si no es exacto.`;
    } else {
      msg.textContent = p ? 'Lo encontrado queda fuera de Pereira y alrededores: ubícalo a mano o pídelo por WhatsApp.'
                          : 'No se encontró esa dirección. Tócala en el mapa o pídela por WhatsApp.';
    }
  }catch(e){ msg.textContent='No se pudo consultar el buscador de direcciones.'; }
  b.disabled=false; b.textContent='Buscar la dirección';
}

async function ubGuardar(c){
  if(UB.lat==null) return toast('Primero marca el punto.');
  const dirNueva = ((document.getElementById('ub-dir')||{}).value||'').trim();
  const barNuevo = ((document.getElementById('ub-barrio-txt')||{}).value||'').trim();
  const antes = {lat:c.lat, lng:c.lng, aprox:c.aprox, dir:c.dir, barrio:c.barrio};   // para deshacer
  const era = c.aprox, barrio = c.barrio||'su barrio';
  const campos = {lat:UB.lat, lng:UB.lng, ubicacion_aprox:false, ubicado_por:'panel:'+(YO.email||'')};
  if(dirNueva !== (c.dir||'')) campos.direccion = dirNueva;
  if(barNuevo !== (c.barrio||'')) campos.barrio = barNuevo || null;

  if(!DEMO){
    const b=document.getElementById('ub-guardar'); b.disabled=true; b.textContent='Guardando…';
    const {error} = await db.from('censo').update(campos).eq('id', c.id);
    if(error){
      // el mensaje crudo de Postgres no le sirve a nadie: se explica y se deja el botón listo
      toast('No se pudo guardar. Revisa la conexión e inténtalo otra vez.');
      console.error('censo update', error);
      b.disabled=false; b.textContent = era?'Reemplazar el punto':'Guardar el punto'; return;
    }
  }
  c.lat=UB.lat; c.lng=UB.lng; c.aprox=false;
  if(campos.direccion!==undefined) c.dir=dirNueva;
  if(campos.barrio!==undefined) c.barrio=barNuevo;
  toastDeshacer(era ? `Punto reemplazado: ${c.ficha||''}. Antes estaba en el centro de ${barrio}.`
                    : `Ubicada: ${c.ficha||c.nombre}`,
    async ()=>{
      if(!DEMO) await db.from('censo').update({lat:antes.lat, lng:antes.lng,
        ubicacion_aprox:antes.aprox, direccion:antes.dir}).eq('id', c.id);
      Object.assign(c, antes); toast('Deshecho.'); vUbicar(); render();
    });
  vUbicar(); render();
}

/* Un toast con salida: guardar sobreescribe datos de una familia, y sin
   deshacer un arrastre accidental del pin se vuelve permanente y silencioso. */
function toastDeshacer(msg, alDeshacer){
  const e=$('#toast');
  e.innerHTML = `<span>${esc(msg)}</span> <button type="button" id="t-undo"
    style="margin-left:10px;background:none;border:0;color:var(--acc);font-family:inherit;
    font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline">Deshacer</button>`;
  e.classList.add('on');
  const cerrar=()=>{ e.classList.remove('on'); setTimeout(()=>e.textContent='',250); };
  clearTimeout(_t); _t=setTimeout(cerrar, 9000);
  const b=document.getElementById('t-undo');
  if(b) b.onclick=async ()=>{ clearTimeout(_t); cerrar(); await alDeshacer(); };
}

/* Descartar archiva con motivo. Nunca DELETE: en un censo de damnificados el
   dato borrado no se reconstruye, y el motivo es la auditoría de por qué. */
const MOTIVOS = [
  ['duplicada','Duplicada de otra ficha'],
  ['fuera','Fuera de la zona de atención'],
  ['atendida','Ya atendida o la familia se mudó'],
  ['erronea','Datos errados, imposible contactar'],
];
function ubDescartar(c){
  abrirSheet(`
    <div class="sec" style="margin-top:4px">Descartar ${esc(c.ficha||'la ficha')}</div>
    <p class="muted" style="margin:6px 0 12px">No se borra: queda archivada con el motivo y se puede
      recuperar. Sale del mapa y de todas las colas.</p>
    <div id="d-motivos">
      ${MOTIVOS.map(([k,n])=>`<button type="button" class="srow" data-mot="${k}">
        <span class="st"><b>${n}</b></span><span class="sw"></span></button>`).join('')}
    </div>
    <input class="campo" id="d-nota" placeholder="Nota (opcional)" style="width:100%;margin-top:10px">
    <button class="btn" id="d-ok" style="width:100%;margin-top:12px" disabled>Archivar la ficha</button>`);
  let mot='';
  document.querySelectorAll('#d-motivos [data-mot]').forEach(b=>b.onclick=()=>{

  });

    if(!DEMO){
      const {error} = await db.from('censo').update({archivada:true, motivo_descarte:mot,
        nota_descarte:nota||null, descartada_por:(YO.email||''), descartada_el:new Date().toISOString()}).eq('id', c.id);
      if(error){ toast('No se pudo archivar. Inténtalo otra vez.'); console.error(error); return; }

      if(!DEMO) await db.from('censo').update({archivada:false, motivo_descarte:null,
        descartada_por:null, descartada_el:null}).eq('id', c.id);
      c.archivada=false; toast('Recuperada.'); vUbicar(); render();
    });

/* ============================================================
   DESPACHOS — asistente de rutas
   ============================================================
   Tres preguntas (qué se entrega, cuántos equipos, con qué reglas) y el
   panel arma los recorridos. El criterio es explicable a mano, sin cajas
   negras: se agrupa por cercanía para que ningún equipo cruce la ciudad,
   y dentro de cada grupo se ordena por las reglas que marque la persona.
   ============================================================ */
/* El censo agrupa en seis necesidades; los reportes usan el catálogo fino
   (mercado, enlatados, cobijas, carpa…). El cruce se hace por CATEGORÍA del
   catálogo, no por clave suelta: así "enlatados" cuenta como alimentos sin
   tener que enumerar cada ítem a mano. */
const DESP_TIPOS = [
  {k:'alimentos',    n:'Mercado / alimentos', cats:['Agua y alimento']},
  {k:'aseo',         n:'Aseo e higiene',      cats:['Higiene personal','Servicios y limpieza']},
  {k:'agua',         n:'Agua potable',        cats:['Agua y alimento']},
  {k:'ropa',         n:'Carpas y cobijas',    cats:['Dónde dormir','Ropa y calzado']},
  {k:'medicamentos', n:'Medicamentos',        cats:['Medicamentos','Insumos médicos','Material de curación','Vida o muerte']},
  {k:'bebes',        n:'Pañales y bebés',     cats:['Bebés y crianza']},
];
// dentro de "Agua y alimento" hay agua y hay comida: se afinan con estas claves
const SOLO_AGUA = new Set(['agua','carrotanq','potabiliza','filtros']);
function repCalza(k){
  const t = DESP_TIPOS.find(x=>x.k===DP.tipo); if(!t) return false;
  const cat = (typeof NEED!=='undefined' && NEED[k]) ? NEED[k].cat : '';
  if(!t.cats.includes(cat)) return false;
  if(DP.tipo==='agua')      return SOLO_AGUA.has(k);
  if(DP.tipo==='alimentos') return !SOLO_AGUA.has(k);
  return true;
}
const DESP_REGLAS = [
  {k:'urgencia',  n:'Urgentes primero',            d:'Las marcadas como urgentes encabezan la ruta'},
  {k:'menores',   n:'Familias con niños pequeños', d:'Menores de 5 años suben en la lista'},
  {k:'mayores',   n:'Adultos mayores',             d:'Mayores de 65 suben en la lista'},
  {k:'inhabit',   n:'Viviendas inhabitables',      d:'Los que están durmiendo fuera'},
  {k:'olvidadas', n:'Las que nunca han recibido',  d:'Prioriza a quien no le ha llegado nada'},
  {k:'grandes',   n:'Hogares numerosos',           d:'Más personas, más peso en la fila'},
  {k:'vulnerable',n:'Hogares vulnerables',         d:'Embarazo, enfermedad grave, discapacidad, sin empleo'},
];

let DP = { paso:1, tipo:'alimentos', unidades:60, equipos:3, tope:8,
           incluirAprox:false, todas:false, conReportes:false, radio:5, reglas:new Set(['urgencia','vulnerable','olvidadas']), rutas:null };

/* Candidatas: solo con punto exacto (a un punto aproximado no se puede
   despachar a nadie) y sin haber recibido lo mismo en la última semana. */
function dpReportes(){
  if(!DP.conReportes) return [];
  return REPORTES.filter(r=>r.lat && r.lng && !repAtendido(r))
    .filter(r=>DP.todas || repCalza(r.k))
    .map(r=>{
      const ct = CONTACTOS[r.folio] || {};
      // el panel no carga calc.js: el nombre de zona sale del mapa ya portado
      const zn = NOMBRE_ZONA.get(r.z) || '';
      return {id:'rep:'+r.id, ficha:r.folio||'', fuente:'reporte',
        nombre: ct.nombre || 'Reporte del mapa', barrio: r.ref || zn, dir:'', sena:'',
        tel: ct.tel||'', personas: r.personas||0, men5:0, may65:0, cond:[],
        ev:'', needs:[DP.tipo], urg:r.u||0,
        pide:(typeof NEED!=='undefined' && NEED[r.k]) ? NEED[r.k].n : r.k, lat:+r.lat, lng:+r.lng, aprox:false,
        archivada:false, ts:r.ts};
    });
}

function dpCandidatas(){
  const base = DP.fuenteCenso===false ? [] : CENSO;
  // Una misma familia puede estar dos veces (se registró en dos brigadas):
  // se manda un solo equipo, no dos. Se identifica por teléfono, y si no hay,
  // por nombre y punto casi idéntico.
  const vistos = new Set();
  const unica = c=>{
    const k = c.tel ? 'tel:'+String(c.tel).replace(/\D/g,'')
      : 'g:'+norma(c.nombre)+'@'+(c.lat?c.lat.toFixed(4)+','+c.lng.toFixed(4):'');
    if(vistos.has(k)) return false;
    vistos.add(k); return true;
  };
  return base.concat(dpReportes()).filter(c=>{
    if(DP.seleccion && DP.seleccion.size && !DP.seleccion.has(String(c.id))) return false;
    if(c.archivada) return false;
    if(!c.lat || !c.lng) return false;
    if(c.aprox && !DP.incluirAprox) return false;
    // "todas por igual": a veces no se reparte según lo que cada quien pidió,
    // sino lo mismo para todo el censo (una donación grande de un solo tipo).
    if(!DP.todas && !(c.needs||[]).includes(DP.tipo)) return false;
    const ya = ENTREGAS.some(y=>y.k===DP.tipo && y.lat &&
      distM(c.lat,c.lng,+y.lat,+y.lng)<300 && (now()-y.ts) < 7*24*H);
    return !ya && unica(c);
  });
}

/* Puntaje según las reglas marcadas: cada regla suma, y se ve por qué. */
function dpPuntaje(c){
  let p = 0; const por = [];
  if(DP.reglas.has('urgencia') && c.urg){ const v=(c.urg||1)*30; p+=v; if(c.urg===3) por.push('urgente'); }
  if(DP.reglas.has('menores')  && c.men5>0){ p+=25; por.push(c.men5+' menor'+(c.men5>1?'es':'')+' de 5'); }
  if(DP.reglas.has('mayores')  && c.may65>0){ p+=20; por.push(c.may65+' mayor'+(c.may65>1?'es':'')+' de 65'); }
  if(DP.reglas.has('inhabit')  && c.ev==='inhabitable'){ p+=35; por.push('vivienda inhabitable'); }
  if(DP.reglas.has('grandes')) p += Math.min(c.personas||0, 12) * 3;
  if(DP.reglas.has('vulnerable')){
    // pesos distintos: no es lo mismo un embarazo de alto riesgo que la
    // pérdida del empleo, aunque las dos cuenten.
    const PESO = {grave:40, embarazo:30, discapacidad:30, sensorial:25, cronica:20, sin_empleo:10};
    const NOM  = {grave:'enfermedad grave', embarazo:'embarazo o lactancia',
                  discapacidad:'discapacidad', sensorial:'discapacidad sensorial',
                  cronica:'enfermedad crónica', sin_empleo:'sin empleo'};
    (c.cond||[]).forEach(k=>{ if(PESO[k]){ p += PESO[k]; if(PESO[k]>=25) por.push(NOM[k]); } });
  }
  if(DP.reglas.has('olvidadas')){
    const cerca = ENTREGAS.some(y=>y.lat && distM(c.lat,c.lng,y.lat,y.lng)<300);
    if(!cerca){ p+=30; por.push('nunca ha recibido'); }
  }
  return {p, por};
}
function distM(a1,o1,a2,o2){ const dy=(a2-a1)*110574, dx=(o2-o1)*111320*Math.cos((a1+a2)/2*Math.PI/180);
  return Math.sqrt(dx*dx+dy*dy); }

/* Agrupar por cercanía (k-means sobre las coordenadas) y ordenar cada grupo
   por regla y luego por vecino más cercano, que es la ruta que menos camina. */
function dpArmar(){
  // Antes se elegían primero las N de más puntaje y DESPUÉS se miraba el mapa:
  // como las de más urgencia están regadas por toda la ciudad, un equipo
  // terminaba cruzando 55 km. Ahora manda la geografía —se arman las zonas con
  // TODAS las candidatas— y el puntaje decide a quién se atiende dentro de
  // cada zona.
  const todas = dpCandidatas().map(c=>({c, ...dpPuntaje(c)}));
  if(!todas.length) return [];

  const K = Math.max(1, Math.min(DP.equipos, todas.length));
  const centroide = g => ({lat:g.reduce((a,x)=>a+x.c.lat,0)/g.length,
                           lng:g.reduce((a,x)=>a+x.c.lng,0)/g.length});

  // Zonas por densidad, no por k-means: sembrar en el punto más lejano hacía
  // que un corregimiento con una sola casa se llevara un equipo entero.
  // Aquí cada equipo se planta donde hay más viviendas juntas y se lleva las
  // más cercanas a esa semilla; lo disperso queda al final, que es donde debe.
  const lim = DP.radio ? DP.radio*1000 : Infinity;
  const libres = todas.slice();
  let quedan = DP.unidades;
  const sobran = [];
  const grupos = [];

  for(let t=0; t<K && libres.length && quedan>0; t++){
    const cupo = Math.min(DP.tope, quedan);
    // semilla: la vivienda con más vecinas dentro del radio (a igualdad, la de
    // más puntaje). Es el centro natural del próximo recorrido.
    let semilla = libres[0], mejor = -1;
    libres.forEach(x=>{
      const cerca = libres.reduce((n,y)=>n + (distM(x.c.lat,x.c.lng,y.c.lat,y.c.lng) <= lim ? 1 : 0), 0);
      const puntaje = Math.min(cerca, cupo)*1000 + x.p;
      if(puntaje > mejor){ mejor = puntaje; semilla = x; }
    });
    // se lleva las más cercanas a la semilla, dentro del radio
    const cerca = libres
      .map(x=>({x, d:distM(semilla.c.lat,semilla.c.lng,x.c.lat,x.c.lng)}))
      .filter(o=>o.d <= lim)
      .sort((a,b)=>a.d-b.d)
      .slice(0, Math.max(cupo*3, cupo));      // vecindario amplio…
    // …y dentro del vecindario manda la prioridad
    const toma = cerca.map(o=>o.x).sort((a,b)=>b.p-a.p).slice(0, cupo);
    if(!toma.length) break;
    toma.forEach(x=>{ const i=libres.indexOf(x); if(i>=0) libres.splice(i,1); });
    quedan -= toma.length;
    grupos.push(toma);
  }
  sobran.push(...libres);

  // orden dentro de la ruta: arrancar por un extremo, vecino más cercano y
  // 2-opt para deshacer los cruces
  const largo = r => { let m=0; for(let j=1;j<r.length;j++)
    m += distM(r[j-1].c.lat,r[j-1].c.lng,r[j].c.lat,r[j].c.lng); return m; };
  const rutas = grupos.filter(g=>g.length).map((g,i)=>{
    const k = centroide(g);
    const orden = g.slice().sort((a,b)=>
      distM(b.c.lat,b.c.lng,k.lat,k.lng) - distM(a.c.lat,a.c.lng,k.lat,k.lng));
    const resto = orden.slice(1); let ruta = [orden[0]];
    while(resto.length){
      const u = ruta[ruta.length-1].c;
      let bi=0, bd=Infinity;
      resto.forEach((x,j)=>{ const d=distM(u.lat,u.lng,x.c.lat,x.c.lng); if(d<bd){bd=d;bi=j;} });
      ruta.push(resto.splice(bi,1)[0]);
    }
    let mejoro = true;
    while(mejoro){
      mejoro = false;
      for(let a=0; a<ruta.length-2; a++)
        for(let b=a+2; b<ruta.length; b++){
          const prueba = ruta.slice(0,a+1).concat(ruta.slice(a+1,b+1).reverse(), ruta.slice(b+1));
          if(largo(prueba) < largo(ruta) - 1){ ruta = prueba; mejoro = true; }
        }
    }
    return {equipo:i+1, paradas:ruta, km:largo(ruta)/1000,
            personas:ruta.reduce((s2,x)=>s2+(x.c.personas||0),0)};
  });
  rutas.sobran = sobran;
  return rutas;
}

/* Actualiza los números sin re-pintar el paso: volver a dibujarlo mientras
   se escribe le quita el foco al campo. */
function dpTotales(){
  const t = document.querySelector('#v-despachos .totalbox');
  if(!t || DP.paso!==1) return;
  const cand = dpCandidatas().length;
  const alcanzan = Math.min(cand, DP.unidades);
  t.querySelector('b').textContent = alcanzan;
  const s2 = t.querySelector('small');
  if(s2) s2.innerHTML = (alcanzan<cand
      ? `solo hay ${DP.unidades} ayudas listas · ${cand-alcanzan} quedan para la próxima`
      : 'alcanza para todas las que se pueden atender')
    + '<br>En el paso siguiente decides cuántos equipos salen.';
  const b = document.getElementById('dp-1');
  if(b) b.textContent = 'Siguiente' + (cand?` · ${alcanzan} destino${alcanzan===1?'':'s'}`:'');
}

function vDespachos(){

  const cand = dpCandidatas().length;
  const reps       = dpReportes();

  const repsN      = reps.length;
  const vivas = (DP.fuenteCenso===false?[]:CENSO).filter(c=>!c.archivada).concat(reps);
  const pide = c=>!c.archivada && (DP.todas || (c.needs||[]).includes(DP.tipo));
  const piden    = vivas.filter(pide);
  const exactas  = piden.filter(c=>c.lat && !c.aprox).length;
  const aproxN   = piden.filter(c=>c.lat && c.aprox).length;
  const sinPunto = piden.filter(c=>!c.lat).length;
  const noPiden  = vivas.length - piden.length;
  const censoPiden = CENSO.filter(c=>!c.archivada && (c.needs||[]).includes(DP.tipo)).length;
  // ubicables = las que podrían entrar según los interruptores de arriba
  const ubicables = exactas + (DP.incluirAprox ? aproxN : 0);
  const atendidas = ubicables - cand;             // filtradas por el anti-duplicado
  const cupo      = DP.equipos * DP.tope;
  const alcanzan  = Math.min(cand, DP.unidades);          // paso 1: sin equipos
  const entran    = Math.min(cand, DP.unidades, cupo);    // paso 2: ya con equipos
  const limite    = entran===cand ? null : (DP.unidades<=cupo ? 'ayudas' : 'cupo');
  const tipoN = (DESP_TIPOS.find(t=>t.k===DP.tipo)||{}).n||DP.tipo;

  if(DP.paso===1){

        ${DP.seleccion && DP.seleccion.size ? `<div class="alert" style="border-left-color:var(--acc);margin-top:14px">
          <div class="ti">Trabajando sobre ${DP.seleccion.size} viviendas traídas del reporte</div>
          <div class="cx">Solo se reparte entre esas. <button type="button" class="lnk" id="dp-todo-censo">Usar todo el censo</button></div>
        </div>`:''}
        <div class="lbl" style="margin-top:18px">¿De dónde salen los destinos?</div>
        <div class="capasel" style="margin-top:8px">
          <label><input type="checkbox" id="dp-fcenso" ${DP.fuenteCenso===false?'':'checked'}>
            <span><i style="background:#7c3aed"></i>Viviendas del censo <b>${CENSO.filter(c=>!c.archivada).length}</b></span></label>
          <label><input type="checkbox" id="dp-freps" ${DP.conReportes?'checked':''}>
            <span><i style="background:#dc2626"></i>Reportes del mapa <b>${REPORTES.filter(r=>r.lat && !repAtendido(r)).length}</b></span></label>
        </div>

        ${DP.fuenteCenso===false?'' : `
        <label class="capasel solo" style="margin-top:8px">
          <input type="checkbox" id="dp-solopide" ${DP.todas?'':'checked'}>
          <span>Solo las viviendas que pidieron <b>${esc(tipoN.toLowerCase())}</b>
            <small>Desmárcalo para llevarle lo mismo a todo el censo</small></span>
        </label>`}

        <div class="lbl" style="margin-top:18px">Cuántas hay</div>
        <div class="desglose" style="margin-top:6px">
          ${DP.fuenteCenso===false?'' : `
            <div class="cl"><b>${censoVivas}</b><span>viviendas en el censo</span></div>
            ${DP.todas?'' : `<div class="cl"><b>${censoPiden}</b><span>de esas, pidieron ${esc(tipoN.toLowerCase())}</span></div>`}`}
          ${DP.conReportes?`<div class="cl"><b>${repsN}</b><span>reportes del mapa${DP.todas?'':' de esa categoría'}</span></div>`:''}
          <div class="cl ok"><b>${piden.length}</b><span>seleccionadas con los filtros de arriba</span></div>

const TICK_SVG = `<svg class="tick ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

function vPersonas(){
  const q = norm(BUSCA).trim(), qd = soloDigitos(BUSCA);
  const cont = { esperando:0, autorizados:0, anulados:0 };
  COORDS.forEach(c=> cont[estadoDe(c)]++);

  let filas = COORDS.filter(c=>estadoDe(c)===SEG);
  if(q) filas = filas.filter(c=>coincide(c,q,qd));

  // UNA fila por persona; sus micro-zonas (de este estado) van en el collapse
  const m = new Map();
  filas.forEach(c=>{ const k=claveP(c); let g=m.get(k);
    if(!g){ g={clave:k, nom:c.nom, foto:c.foto, tel:c.tel, tel_e164:c.tel_e164, zonas:[], _ts:0}; m.set(k,g); }
    g.zonas.push(c);
    if(c.creado > g._ts){ g._ts=c.creado; g.nom=c.nom; g.foto=c.foto||g.foto; g.tel=c.tel; g.tel_e164=c.tel_e164; } });
  const grupos = [...m.values()];
  grupos.forEach(g=>{ g.zonas.sort((a,b)=>b.creado-a.creado);
    g.min=Math.min(...g.zonas.map(z=>z.creado)); g.max=Math.max(...g.zonas.map(z=>z.creado)); });
  // esperando: el que lleva más tiempo primero; el resto: más reciente primero
  grupos.sort((a,b)=> SEG==='esperando' ? a.min-b.min : b.max-a.max);

  const vacTxt = {
    esperando: BUSCA?'Nadie esperando con esa búsqueda.':'Nadie esperando. Todo al día.',
    autorizados: BUSCA?'Ningún autorizado con esa búsqueda.':'Todavía no hay autorizados.',
    anulados: BUSCA?'Ningún anulado con esa búsqueda.':'Ninguno anulado.',
  };

  $('#v-personas').innerHTML = `
    <div class="buscabox">
      <input id="q" type="search" autocomplete="off" placeholder="Buscar por nombre, código o celular" value="${esc(BUSCA)}">
      <button class="limpiar" id="limpiar" ${BUSCA?'':'hidden'} aria-label="Limpiar">×</button>
    </div>
    <div class="seg" id="seg">
      <button data-s="esperando"   class="${SEG==='esperando'?'on':''}">Esperando <span class="c">${cont.esperando}</span></button>
      <button data-s="autorizados" class="${SEG==='autorizados'?'on':''}">Autorizados <span class="c">${cont.autorizados}</span></button>
      <button data-s="anulados"    class="${SEG==='anulados'?'on':''}">Anulados <span class="c">${cont.anulados}</span></button>
    </div>
    ${grupos.length ? grupos.map(grupoPersona).join('')
      : `<div class="vacio"><div class="vic">${ico('search')}</div><b>${esc(vacTxt[SEG])}</b>
           <p>${SEG==='esperando'?'Cuando alguien se inscriba y le envíe su código, aparece aquí.':''}</p></div>`}`;
}

/* Una persona = una fila. Si maneja varias micro-zonas (en este estado),
   la fila se despliega para verlas; si es una sola, va directo a su ficha. */
function grupoPersona(g){
  const zs = g.zonas;
  const wa = waLink(g.tel_e164||g.tel, `Hola ${g.nom||''}, le escribo de Aquí Estamos para confirmar su inscripción.`);
  const waBtn = `<a class="waq" href="${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">${WA_SVG}</a>`;
  const tick = zs.every(z=>z.ver && !z.anulado) ? TICK_SVG : '';

  if(zs.length === 1){
    const c = zs[0];
    const cls = c.anulado?'anulada' : (!c.ver?'pendiente':'');
    return `<div class="pgroup"><div class="prow ${cls}">
      ${avatar(g)}
      <div class="info" data-ficha="${esc(c.id)}">
        <div class="nm">${esc(g.nom)}${tick}</div>
        <div class="mt">${esc(zonaNombre(c.z))}${c.micro?' · '+esc(c.micro):''} · ${hace(c.creado)}</div>
        <div class="cd">${esc(c.codigo||'—')}</div>
      </div>
      ${waBtn}
      <button class="kebab" data-ficha="${esc(c.id)}" aria-label="Ver ficha">⋮</button>
    </div></div>`;
  }

  const cls = zs.every(z=>z.anulado)?'anulada' : (zs.some(z=>!z.ver)?'pendiente':'');
  const zonasResumen = [...new Set(zs.map(z=>zonaNombre(z.z)))].join(', ');
  const sub = zs.map(z=>`<button class="subrow" data-ficha="${esc(z.id)}">
      <span class="grow"><span class="sm">${esc(z.micro||zonaNombre(z.z))}</span>
      <span class="mt">${esc(zonaNombre(z.z))} · ${hace(z.creado)}</span></span>
      <span class="cd">${esc(z.codigo||'—')}</span></button>`).join('');
  return `<div class="pgroup"><div class="prow ${cls}">
    ${avatar(g)}
    <div class="info" data-toggle>
      <div class="nm">${esc(g.nom)}${tick}</div>
      <div class="mt">${zs.length} micro-zonas · ${esc(zonasResumen)}</div>
    </div>
    ${waBtn}
    <button class="chev" data-toggle aria-label="Ver sus micro-zonas">▾</button>
  </div>
  <div class="subzones" hidden>${sub}</div></div>`;
}

/* ---------- FICHA (hoja) ---------- */
function abrirFicha(id){
  const c = COORDS.find(x=>x.id===id); if(!c) return;
  const otras = micrasDe(c).filter(x=>x.id!==c.id);
  const wa = waLink(c.tel_e164||c.tel, `Hola ${c.nom||''}, le escribo de Aquí Estamos.`);
  const st = estadoDe(c);
  const sello = c.anulado?'<span class="pend">anulado</span>'
    : c.ver?'<span class="verif">verificado ✓</span>':'<span class="pend">esperando</span>';

  let acciones = `<a class="btn wa" href="${wa}" target="_blank" rel="noopener">${icoWA()} Escribirle por WhatsApp</a>`;
  if(st==='esperando')
    acciones = `<button class="btn" data-ok="${esc(c.id)}">Autorizar esta inscripción</button>` + acciones;
  if(st==='anulados')
    acciones = `<button class="btn" data-si="${esc(c.id)}">Reactivar</button>` + acciones;

  const pie = c.anulado ? '' :
    `<button class="destroy" data-no="${esc(c.id)}">Anular autorización</button>`;

  abrirSheet(`
    <div class="fichacab">
      ${avatar(c,'big')}
      <div class="grow"><div class="nm">${esc(c.nom)}</div>
        <div class="rl">${esc(c.rol||'Coordinador')} · ${sello}</div></div>
    </div>
    <div class="codewrap">
      <div class="k">Código que le llegó por WhatsApp</div>
      <div class="codebg"><span class="cod">${esc(c.codigo||'—')}</span>
        <button class="copiar" data-copiar="${esc(c.codigo||'')}">Copiar</button></div>
      <div class="muted" style="margin-top:6px">Si coincide con el que le escribió, es esa persona.</div>
    </div>
    <div class="kv"><span class="k">Celular</span><a class="v tel" href="${wa}" target="_blank" rel="noopener">${esc(telBonito(c.tel))}</a></div>
    <div class="kv"><span class="k">Zona</span><span class="v">${esc(zonaNombre(c.z))}${c.micro?' · '+esc(c.micro):''} · ${c.radio||500} m</span></div>
    ${c.nota?`<div class="kv"><span class="k">Nota</span><span class="v">${esc(c.nota)}</span></div>`:''}
    <div class="kv"><span class="k">Inscrito</span><span class="v">${hace(c.creado)}</span></div>
    ${otras.length?`<div class="kv"><span class="k">Otras micro-zonas</span><span class="v">${otras.map(o=>esc(o.micro||zonaNombre(o.z))).join(', ')}</span></div>`:''}
    <div style="margin-top:14px">${acciones}</div>
    ${pie}
  `);
}

  // necesita gente: zonas con reportes y 0 coordinadores verificados

        <div class="grow"><b>${esc(s.z.n)}</b><span>${s.reps} reporte${s.reps>1?'s':''} · sin coordinador verificado · ${etiqueta(s.idx)}</span></div>
        <button class="mini" data-abrir-mapa>Ver</button>
      </div>`).join('')}`:''}
    ${cubiertas.length?`<div class="lbl">Cubiertas</div>
      ${cubiertas.map(s=>`<div class="zrow">
        <div class="pin" style="background:${color(s.idx)}22;color:${color(s.idx)}">${ico('pin')}</div>

      </div>`).join('')}`:''}
    ${sinNombre.length?`<div class="lbl">Sin nombre todavía</div>
      ${sinNombre.slice(0,8).map(f=>`<div class="zrow">

/* preview del mapa: mapa Leaflet real (mismos tiles que la app pública),
   no interactivo, con un punto por zona reportada coloreado por desatención.
   Al tocarlo abre el mapa completo. */
let zmap = null;
function montarMiniMapa(rows){
  const el = document.getElementById('zmap');
  if(!el || typeof L === 'undefined') return;
  if(zmap){ try{ zmap.remove(); }catch(_){} zmap = null; }
  zmap = L.map(el, {zoomControl:false, attributionControl:false, dragging:false,
    scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false,
    touchZoom:false, tap:false}).setView([4.803,-75.735], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, opacity:.8}).addTo(zmap);
  const pts = [];
  rows.forEach(s=>{
    L.circleMarker([s.z.lat, s.z.lng], {radius:7, weight:2, color:'#0e1729',
      fillColor:color(s.idx), fillOpacity:1}).addTo(zmap);
    pts.push([s.z.lat, s.z.lng]);
  });
  // coordinadores como puntos pequeños, para dar contexto de cobertura
  activos().forEach(c=>{ if(c.lat) L.circleMarker([c.lat, c.lng],
    {radius:3.5, weight:0, fillColor:'#4f9cf9', fillOpacity:.9}).addTo(zmap); });
  if(pts.length){ try{ zmap.fitBounds(pts, {padding:[30,30], maxZoom:12}); }catch(_){} }
  el.addEventListener('click', ()=>{ location.href='/'; });
  setTimeout(()=>{ if(zmap) zmap.invalidateSize(); }, 80);
}

/* En escritorio las filas se ven mejor en columnas. En vez de tocar el HTML
   de cada vista, se agrupan aquí las .prow consecutivas dentro de un
   contenedor; la rejilla la arma el CSS y en móvil no aplica. */
function agruparFilas(){
  document.querySelectorAll('.view').forEach(v=>{
    v.querySelectorAll(':scope > .prow-grid').forEach(g=>{
      while(g.firstChild) g.parentNode.insertBefore(g.firstChild, g);
      g.remove();
    });
    let grupo=null;
    const enRejilla = el => el.classList.contains('prow') || el.classList.contains('pgroup');
    [...v.children].forEach(el=>{
      if(enRejilla(el)){
        if(!grupo){ grupo=document.createElement('div'); grupo.className='prow-grid';
          el.parentNode.insertBefore(grupo, el); }
        grupo.appendChild(el);
      } else grupo=null;
    });
  });
}

async function exportar(){
  if(ROL!=='admin') return toast('Exportar lo hace la coordinación general.');
  if(DEMO){ toast('En modo demo no hay base que exportar.'); return; }
  toast('Bajando…');
  try{
    const [r,e,c] = await Promise.all([
      db.from('reportes').select('*').order('creado',{ascending:false}),
      db.from('entregas').select('*').order('creado',{ascending:false}),
      db.from('coordinadores').select('*').order('creado',{ascending:false}),
    ]);
    const err = r.error||e.error||c.error;
    if(err) return toast('No se pudo exportar: '+err.message);
    const hoy = new Date().toISOString().slice(0,10);
    const blob = new Blob([JSON.stringify({exportado:new Date().toISOString(),
      reportes:r.data||[], entregas:e.data||[], coordinadores:c.data||[]}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `aqui-estamos-${hoy}.json`; a.click();
    URL.revokeObjectURL(a.href);
    toast(`Exportado: ${(r.data||[]).length} reportes, ${(e.data||[]).length} entregas, ${(c.data||[]).length} coordinadores.`);
  }catch(ex){ toast('No se pudo exportar.'); }
}

function exportarCenso(){
  if(ROL!=='admin') return toast('Exportar el censo lo hace la coordinación general.');
  if(!CENSO.length){ toast(AKEY()||DEMO?'No hay viviendas en el censo.':'Tu correo no tiene permiso de administración.'); return; }
  const cab = ['ficha','nombre','cedula','telefono','barrio','direccion','sena','personas','menores5','mayores65','condiciones','estado_vivienda','necesidades','detalle','lat','lng','registrado'];
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const filas = CENSO.map(c=>[c.ficha,c.nombre,c.cedula,c.tel,c.barrio,c.dir,c.sena,c.personas,c.men5,c.may65,
    (c.cond||[]).join('; '),c.ev,(c.needs||[]).join('; '),c.detalle,c.lat??'',c.lng??'',new Date(c.ts).toISOString()].map(q).join(','));
  const blob = new Blob(['\ufeff'+cab.join(',')+'\n'+filas.join('\n')], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='censo-aqui-estamos-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  URL.revokeObjectURL(a.href);
  toast('Censo exportado: '+CENSO.length+' viviendas.');
}

// acciones del reporte
document.addEventListener('click', e=>{
  const kpi = e.target.closest('[data-rkpi]');
  if(kpi){
    const k=kpi.dataset.rkpi;
    if(k==='todo'){ REP.urg.clear(); REP.cond.clear(); REP.nec.clear(); REP.est.clear();
      REP.barrio=''; REP.red=''; REP.q=''; }
    if(k==='urg3'){ REP.urg.has('3')?REP.urg.delete('3'):REP.urg.add('3'); }
    if(k==='vuln'){ ['grave','embarazo','discapacidad','sensorial'].forEach(x=>REP.cond.delete(x));
      REP.vulnTodo = !REP.vulnTodo;
      if(REP.vulnTodo) REP.cond.add('__vuln'); else REP.cond.delete('__vuln'); }
    if(k==='men'){ REP.cond.has('menores')?REP.cond.delete('menores'):REP.cond.add('menores'); }
    if(k==='empleo'){ REP.cond.has('sin_empleo')?REP.cond.delete('sin_empleo'):REP.cond.add('sin_empleo'); }
    if(k==='sinub'){ REP.est.has('sin')?REP.est.delete('sin'):REP.est.add('sin'); }
    if(k==='atend'){ REP.est.has('viejo')&&REP.est.delete('viejo');
      REP.est.has('nunca')?REP.est.delete('nunca'):REP.est.add('nunca'); }
    REP.ver=40; vReporte(); return;
  }
  if(e.target.closest('#rep-filtros')){ REP.modal=true; vReporte(); return; }
  if(e.target.closest('#rep-cerrar') || e.target.closest('#rep-cancelar')
     || e.target.id==='rep-scrim'){ REP.modal=false; vReporte(); return; }
  if(e.target.closest('#rep-aplicar')){ REP.modal=false; REP.ver=40; vReporte(); return; }
  const ch = e.target.closest('[data-rchip]');
  if(ch){ const [g,k]=ch.dataset.rchip.split(':');
    REP[g].has(k)?REP[g].delete(k):REP[g].add(k); vReporte(); return; }
  const qt = e.target.closest('[data-rquita]');
  if(qt){ const [g,k]=qt.dataset.rquita.split(':');
    if(g==='barrio') REP.barrio=''; else if(g==='red') REP.red=''; else REP[g].delete(k);
    vReporte(); return; }
  if(e.target.closest('#rep-limpiar') || e.target.closest('#rep-limpiar2')){
    REP.urg.clear(); REP.cond.clear(); REP.nec.clear(); REP.est.clear();
    REP.barrio=''; REP.red=''; REP.q=''; REP.ver=40; vReporte(); return; }
  if(e.target.closest('#rep-criticos')){
    // cruce entre grupos: urgente Y vulnerable Y sin recibir
    REP.urg=new Set(['3']); REP.cond=new Set(['__vuln']); REP.est=new Set(['nunca']);
    REP.nec.clear(); REP.barrio=''; REP.red=''; REP.q=''; REP.ver=40; vReporte(); return; }
  const ord = e.target.closest('[data-rord]');
  if(ord){ const k=ord.dataset.rord;
    if(REP.col===k) REP.dir=-REP.dir; else { REP.col=k; REP.dir=-1; }
    vReporte(); return; }
  if(e.target.closest('#rep-mas')){ REP.ver+=40; vReporte(); return; }
  if(e.target.closest('#rep-csv')){ repCSV(); return; }
  if(e.target.closest('#rep-print')){ window.print(); return; }
  if(e.target.closest('#rep-jornada')){
    DP.seleccion = new Set(repFiltrar().map(c=>String(c.id)));
    DP.paso=1; DP.rutas=null; ir('despachos');
    toast(DP.seleccion.size+' viviendas llevadas al asistente.'); return;
  }
});

function copiar(txt){ if(!txt) return;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Copiado: '+txt)).catch(()=>toast(txt));
  else toast(txt); }

/* Copiar con acuse en el propio botón: en la calle, con el teléfono en una
   mano y el mercado en la otra, un aviso que se va en dos segundos no se
   alcanza a ver. El botón se queda en "Copiado" un momento. */
function copiarCon(btn, txt){
  if(!txt) return;
  const antes = btn.dataset.antes || btn.textContent;
  btn.dataset.antes = antes;
  const listo = ()=>{ btn.textContent = 'Copiado'; btn.classList.add('ok');
    clearTimeout(btn._t); btn._t = setTimeout(()=>{
      btn.textContent = antes; btn.classList.remove('ok'); }, 1600); };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(listo).catch(()=>toast(txt));
  else toast(txt);
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-copiar]');
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  copiarCon(b, b.getAttribute('data-copiar'));
});

let db = null;

async function marcar(id, campo, valor, aviso){
  if(DEMO){ const c=COORDS.find(x=>x.id===id); if(c){ if(campo==='verificado')c.ver=valor; if(campo==='anulado')c.anulado=valor; }
    toast(aviso); cerrarSheet(); render(); return; }
  const {error} = await db.from('coordinadores').update({[campo]:valor}).eq('id', id);
  toast(error?'No se pudo: '+error.message:aviso);
  cerrarSheet(); await cargar();
}

async function cargar(){
  const desde = new Date(now() - 30*24*H).toISOString();
  // el rol decide qué se pide: pedirle a la base algo que el rol no puede
  // ver no es un error de seguridad (RLS lo niega), pero sí ruido inútil.
  const rr = await db.rpc('mi_rol');
  ROL  = rr.data || null;
  PRIV = !!ROL;
  if(!PRIV){ toast('Esta cuenta no tiene acceso al panel.'); CENSO=[]; CONTACTOS={}; render(); return; }
  aplicarRol();

  const esAdm = ROL==='admin';
  const [r,e,c] = await Promise.all([
    esAdm ? db.from('reportes').select('*').gte('creado',desde).order('creado',{ascending:false}).limit(5000) : {data:[]},
    db.from('entregas').select('*').gte('creado',desde).order('creado',{ascending:false}).limit(5000),
    esAdm ? db.from('coordinadores').select('*').order('creado',{ascending:false}).limit(2000) : {data:[]},
  ]);
  if(r.error||e.error||c.error){ toast('No se pudo leer los datos.'); return; }
  REPORTES = (r.data||[]).map(deRep);
  ENTREGAS = (e.data||[]).map(deEnt);
  COORDS   = (c.data||[]).map(deCoo);

  const [cont, cen] = await Promise.all([
    esAdm ? db.from('reportes_contacto').select('folio,nombre,tel_e164,whatsapp').order('creado',{ascending:false}).limit(2000) : {data:[]},
    db.from('censo').select('*').order('creado',{ascending:false}).limit(3000),
  ]);
  CONTACTOS = {}; (cont.data||[]).forEach(x=>{ if(x.folio && !CONTACTOS[x.folio]) CONTACTOS[x.folio]={nombre:x.nombre,tel:x.tel_e164,whatsapp:x.whatsapp}; });
  CENSO = (cen.data||[]).map(deCen);
  await cargarJornadas();
  render();
}

/* Clave, no enlace: Hotmail y Yahoo descartan en silencio el correo del
   enlace mágico. El enlace queda como alternativa para quien lo prefiera. */
$('#entrar').onclick = async ()=>{
  const email = $('#mail').value.trim().toLowerCase();
  // Al pegar un PIN desde WhatsApp casi siempre viaja un espacio pegado, y
  // el teclado del teléfono agrega otro al final. Ninguna clave nuestra
  // lleva espacios, así que se quitan todos antes de intentar.
  const clave = $('#clave').value.replace(/\s+/g,'');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Revise el correo');
  if(!clave) return toast('Escriba su clave');
  const b=$('#entrar'); b.disabled=true; b.textContent='Entrando…';
  const {error} = await db.auth.signInWithPassword({email, password:clave});
  b.disabled=false; b.textContent='Entrar';
  if(error){
    // Decir qué revisar sirve más que un "incorrectos" a secas: Supabase
    // responde igual si el correo no existe o si la clave no coincide.
    $('#msg').innerHTML = /invalid/i.test(error.message)
      ? 'No coincide el correo con la clave.<br><span style="opacity:.75">Revise que el correo esté completo y que la clave sea la que le pasaron, sin espacios.</span>'
      : 'No se pudo entrar: '+esc(error.message)

};
